out the chaff in a breeze.", "fungi": "Twist or cut mushrooms at the base, brush off soil in the woods and carry them in a basket, never a plastic bag. Only take ones you're 100% sure of, leave old and very young ones, and follow local limits.", "protein": "Check local rules, licences, size limits and water-quality warnings before taking any shellfish or fish."}, "HARVEST": {"nettle": "Wear gloves and snip the top four leaves of plants that haven't flowered.", "dandelion": "Pick young leaves from plants not yet in flower; flowers on a sunny morning when fully open; dig roots in autumn with permission.", "chickweed": "Snip the soft top few centimetres with scissors, leaving the roots so it regrows within weeks.", "woodsorrel": "Pinch off a few leaves and flowers from large patches; never pull up the creeping roots.", "garlicmustard": "Pick young leaves in spring and the tender flowering tops; pulling whole plants is fine where it is invasive.", "lambsquarters": "Pick the top 10–15 cm of young plants; strip seeds in autumn by running a hand up the dry spikes.", "plantain": "Pick young, soft leaves from the centre of the rosette, and green flower buds before they open.", "watercress": "Cut stems above the water line with scissors, only from clean, flowing water away from livestock.", "hops": "Snap off the top 10–15 cm of new shoots where they bend easily, like asparagus.", "spruce": "Pick the bright new tips once the brown papery caps fall off, a few from each branch, spread across many trees.", "blackberry": "Pick glossy, fully black berries that come away easily; wear long sleeves and avoid low berries by dog-walking paths.", "raspberry": "Pick berries that slip off their core with no tug, into a shallow container.", "lingonberry": "Pick ripe red clusters from late August; berries keep well because they are naturally preserved.", "cloudberry": "Pick when amber and soft, with the green husk easily separated; check whether picking is restricted on that land.", "strawberry": "Pick the tiny berries when fully red and soft; leave plants and runners undisturbed.", "elderberry": "Cut whole drooping clusters when every berry is dark purple; strip off stalks with a fork before cooking.", "elderflower": "Cut fully open, creamy flower heads on a sunny morning; smell them and use the same day. Leave plenty for berries.", "rosehip": "Pick firm, bright red hips after a frost, from many bushes; leave plenty for birds.", "hawthorn": "Strip dark red haws in autumn; young leaves can be picked in spring.", "crabapple": "Collect fallen or easily picked apples in autumn; slightly underripe ones have the most pectin.", "cranberry": "Pick red berries from the bog surface in autumn; stay on boardwalks where they exist.", "crowberry": "Strip the black berries from the mats with a berry comb or by hand.", "gooseberry": "Pick when berries soften and colour; wear gloves against the spines.", "juniper": "Pick only the blue-black, ripe berries (two years old), leaving green ones to ripen.", "hazelnut": "Pick nuts as husks turn brown and the nut slips out, before squirrels get them; or gather fallen nuts.", "chestnut": "Gather fallen nuts with gloves or by rolling the spiny cases open with your boots; choose plump, shiny nuts.", "beechnut": "Gather fallen nuts in mast years; most husks are empty, so test a few first.", "linden": "Pick flower clusters with their leafy bract when the scent is strongest, early in flowering.", "yarrow": "Snip young leaves in spring and flower heads in summer.", "redclover": "Pick fresh pink heads in full bloom, avoiding brown ones.", "burdock": "Dig first-year roots in autumn or early spring with the landowner's permission; they can be long, so use a narrow spade.", "dulse": "Cut fronds with scissors at low tide, leaving the base attached so it regrows.", "kelp": "Cut the blade above the stipe at spring low tides, never pulling up the holdfast.", "laver": "Peel sheets off rocks at low tide, taking a little from many rocks.", "mussel": "Twist mussels off rocks at low tide, taking only large ones, and check local toxin warnings first.", "chanterelle": "Cut or twist at the base, brush off soil and needles on the spot, and leave small ones to grow.", "porcini": "Twist out firm, young specimens; slice in half on the spot to check for maggots.", "puffball": "Cut only young, pure-white, firm puffballs; slice each in half to check it's white all through.", "chickenwoods": "Cut the soft outer edges of young brackets with a knife, leaving the tough base on the tree.", "hedgehog": "Cut at the base and brush off the spines' debris; leave small ones to spread spores.", "ramps": "Cut a single leaf per plant with scissors and leave the bulb in the ground. Only pick from large, healthy patches.", "fiddlehead": "Snap off two or three tight coils per crown, leaving at least half so the fern survives.", "maple": "Drill a 5/16-inch hole 5 cm deep on the sunny side, tap in a spile and hang a clean bucket. Collect daily and keep the sap cold.", "birchsap": "Drill a small hole a few centimetres deep, collect for a few days only, then plug the hole with a twig.", "acorn": "Gather fallen acorns without holes. Float them and discard floaters.", "pawpaw": "Shake the trunk gently: ripe pawpaws drop, or pick fruit that is soft and fragrant.", "persimmon": "Gather fruit from the ground once soft and wrinkled, after the first frost.", "cattail": "Pull young inner shoots in spring; green flower spikes in early summer; yellow pollen by shaking heads into a bag.", "pricklypear": "Use tongs and thick gloves; twist off ripe red fruit and roll them in sand to remove spines.", "sumac": "Cut whole red clusters on a dry day before rain washes off the sour coating.", "wildrice": "Harvesting needs a licence; ricers bend stalks over a canoe and knock ripe grains loose with sticks.", "camas": "Mark plants while in flower so you dig only blue-flowered camas later; take a few bulbs and replant the small ones.", "carrageen": "Cut fronds at spring low tides, leaving the base, and bleach them by rinsing in rain and sun.", "cleavers": "Pick the soft tops in early spring before they get bristly.", "sealettuce": "Pick fresh green sheets in rock pools, leaving the holdfast.", "icelandmoss": "Gather small amounts by hand from clean upland areas, leaving most of the patch.", "rugosa": "Pick firm red hips in late summer; wear gloves against the prickles."}, "METHODS": [{"id": "dry", "name": "Dry herbs and greens", "keeps": "Keeps 6–12 months", "steps": ["Shake off insects and dirt; wash only if needed and dry well.", "Hang in small bunches or spread thinly on a screen in a warm, airy place out of direct sun.", "When leaves crumble, strip them from the stems.", "Store in airtight jars in the dark."]}, {"id": "freeze", "name": "Blanch and freeze", "keeps": "Keeps 8–12 months", "steps": ["Wash and trim.", "Plunge into boiling water for 1–2 minutes, then into ice water.", "Squeeze or drain dry and pack into portions.", "Freeze flat in bags so they thaw fast."]}, {"id": "jam", "name": "Jam, jelly and fruit cheese", "keeps": "Keeps a year unopened", "steps": ["Simmer fruit with a little water until soft; strain through a cloth for jelly.", "Add sugar (about equal weight for jam) and boil hard to setting point.", "Pour into hot sterilised jars and seal.", "Crab apples add pectin to low-pectin berries."]}, {"id": "cordial", "name": "Cordials and syrups", "keeps": "Keeps 2–3 months in the fridge; a year frozen", "steps": ["Steep flowers in cold water overnight, or simmer berries and strain.", "Dissolve sugar into the liquid with lemon or citric acid.", "Bottle hot into sterilised bottles.", "Dilute about 1 to 10 with water or sparkling water."]}, {"id": "infuse", "name": "Infused vinegar, oil and pesto", "keeps": "Vinegar keeps a year; pesto 3 months frozen", "steps": ["Pack fresh herbs or flowers loosely into a jar.", "Cover with vinegar and leave 2–4 weeks in the dark, then strain.", "For pesto, blend leaves with oil, nuts and salt and freeze in ice-cube trays.", "Never store fresh garlic or herbs in oil at room temperature."]}, {"id": "pickle", "name": "Pickle and ferment", "keeps": "Keeps 6–12 months", "steps": ["Pack shoots, buds or roots tightly into a clean jar.", "Cover with hot spiced vinegar brine, or with 2% salt brine to ferment.", "Keep vegetables under the liquid with a weight.", "Ferments are ready in 1–3 weeks; move to the fridge."]}, {"id": "nuts", "name": "Cure and store nuts", "keeps": "Keeps 6–12 months", "steps": ["Remove husks; float nuts in water and discard any that float.", "Dry in the shell in a single layer in an airy, rodent-proof place for 2–4 weeks.", "Store cool and dry; shell as needed.", "Freeze shelled nuts to stop them going rancid."]}, {"id": "leach", "name": "Leach acorns", "keeps": "Flour keeps 6 months frozen", "steps": ["Shell and chop or grind acorns.", "Soak in cold water, changing it daily, until the bitterness is gone (several days), or boil in changes of water.", "Dry the meal at low heat.", "Grind to flour for breads and pancakes."]}, {"id": "roots", "name": "Store roots", "keeps": "Keeps 2–4 months", "steps": ["Don't wash; brush off soil and let skins dry.", "Pack in damp sand or sawdust in a box.", "Keep cold and dark, just above freezing.", "Check monthly and remove any soft ones."]}, {"id": "detox", "name": "Make it safe to eat", "keeps": "Do this every time", "steps": ["Nettles: cooking, blanching or drying removes the sting.", "Fiddleheads: boil 15 minutes and discard the water before eating.", "Elderberries: always cook them; raw berries, leaves and stems cause sickness.", "Acorns: leach out the tannins before eating."]}], "DANGER": [["Water hemlock", "Cicuta maculata", "White umbrella flowers by water. The most poisonous plant in North America; a bite of root can kill."], ["Poison hemlock", "Conium maculatum", "Tall, purple-blotched, hollow stems and lacy leaves along roads and ditches. Deadly."], ["Death camas", "Toxicoscordion", "Grassy-leaved meadow lily with creamy flowers, growing with wild onions and camas. Deadly."], ["Pokeweed", "Phytolacca americana", "Magenta stems and strings of purple berries. Roots, berries and mature leaves are poisonous."], ["Jimsonweed", "Datura stramonium", "Trumpet flowers and spiny seed pods on disturbed ground. Causes delirium and death."], ["Yew", "Taxus", "Evergreen with flat soft needles and red cup berries. The seed and foliage are deadly."], ["Moonseed", "Menispermum canadense", "Grape-like vine with one crescent seed per berry. Deadly."], ["Other wild mushrooms", "Amanita and others", "Death caps and destroying angels kill. Only eat the mushrooms in this guide, start with the five beginner ones, and only when 100% sure."], ["Giant hogweed", "Heracleum mantegazzianum", "Huge umbels over 2 m tall. The sap burns skin badly in sunlight."]], "LOOK": [{"p": ["morel"], "tw": "gyromitra", "name": "False morel", "sci": "Gyromitra esculenta", "local": "False morel · Beefsteak mushroom", "sev": "Deadly", "tells": ["Slice it in half from top to bottom: a true morel is one continuous hollow chamber.", "False morels are wrinkled and brain-like rather than pitted, and are stuffed with cottony fibres.", "Morel caps attach directly to the stem; half-free morels hang like a skirt but are still hollow."]}, {"p": ["oystermush"], "tw": "pleurocybella", "name": "Angel wings", "sci": "Pleurocybella porrigens", "local": "Angel wings", "sev": "Poisonous", "tells": ["Angel wings are thin, pure white and grow on conifer wood.", "Oyster mushrooms are thicker and fleshier, usually grey-brown to cream, on hardwoods, and smell of anise."]}, {"p": ["shaggymane"], "tw": "coprinopsis", "name": "Common ink cap", "sci": "Coprinopsis atramentaria", "local": "Tippler's bane", "sev": "Harmful", "tells": ["Shaggy mane is tall, white and covered in shaggy scales.", "The ink cap is smaller, smooth and grey-brown, in clusters.", "Ink cap with alcohol, even days later, causes violent sickness."]}, {"p": ["kudzu"], "tw": "toxicodendron", "name": "Poison ivy", "sci": "Toxicodendron radicans", "local": "Poison ivy", "sev": "Harmful", "tells": ["Both have leaves in threes. Kudzu leaflets are large, hairy and often lobed; poison ivy leaves are smooth and often glossy.", "Kudzu stems are fuzzy; poison ivy vines have hairy aerial roots on trees.", "Poison ivy oil causes blistering rashes, even from dead vines."]}, {"p": ["balsamfir", "juniper"], "tw": "taxus", "name": "Yew", "sci": "Taxus canadensis / T. brevifolia", "local": "Canada yew · Pacific yew", "sev": "Deadly", "tells": ["Yew needles are flat and green on both sides with no white stripes and no resin smell.", "Yew has red, cup-shaped berries, not cones.", "Fir smells of resin; juniper berries are blue and dusty."]}, {"p": ["elderflower", "elderberry"], "tw": "conium", "name": "Poison hemlock", "sci": "Conium maculatum", "local": "Poison hemlock", "sev": "Deadly", "tells": ["Elder is a woody shrub. Poison hemlock is a soft, hollow-stemmed plant.", "Hemlock stems are smooth with purple blotches.", "Crushed hemlock smells mousy and unpleasant."]}, {"p": ["camas"], "tw": "toxicoscordion", "name": "Death camas", "sci": "Toxicoscordion venenosum", "local": "Death camas", "sev": "Deadly", "tells": ["Camas has blue-violet star flowers. Death camas has creamy-white flowers in a tighter cluster.", "The bulbs and leaves look alike out of flower, so only dig plants marked while flowering."]}, {"p": ["wildonion", "fieldgarlic", "ramps"], "tw": "convallaria", "name": "Lily of the valley", "sci": "Convallaria majalis", "local": "Lily of the valley", "sev": "Deadly", "tells": ["Ramps and wild onions smell of onion or garlic. Lily of the valley smells of nothing when crushed.", "Lily of the valley has nodding white bell flowers in a row."]}, {"p": ["ramps", "solomonseal"], "tw": "veratrum", "name": "False hellebore", "sci": "Veratrum viride", "local": "False hellebore · Corn lily", "sev": "Deadly", "tells": ["False hellebore leaves are deeply pleated along their length.", "It grows from a tall stalk with many leaves; ramps have 2–3 leaves from the base, and Solomon's seal shoots have smooth, unpleated leaves on an arching stem.", "No onion smell."]}, {"p": ["wildgrape"], "tw": "menispermum", "name": "Moonseed", "sci": "Menispermum canadense", "local": "Canada moonseed", "sev": "Deadly", "tells": ["Grape has forked tendrils; moonseed has none.", "Grape berries have 2–4 teardrop seeds; moonseed has a single crescent-moon seed.", "Moonseed leaves join the stalk slightly inside the edge."]}, {"p": ["cattail"], "tw": "iris", "name": "Yellow flag iris", "sci": "Iris pseudacorus", "local": "Yellow flag iris", "sev": "Harmful", "tells": ["Cattail leaves are D-shaped in section and spongy; iris leaves are flat and sharp-edged in a fan.", "Iris has yellow flowers; cattail has a brown sausage head."]}, {"p": ["elderberry"], "tw": "phytolacca", "name": "Pokeweed berries", "sci": "Phytolacca americana", "local": "Pokeweed", "sev": "Poisonous", "tells": ["Pokeberries hang in long drooping strings on magenta stems.", "Elderberries sit in flat-topped umbrellas on a woody shrub."]}, {"p": ["chickweed"], "tw": "anagallis", "name": "Scarlet pimpernel", "sci": "Lysimachia arvensis", "local": "Scarlet pimpernel", "sev": "Harmful", "tells": ["Chickweed has a single line of hairs down its stem and white flowers.", "Scarlet pimpernel has square stems, black dots under the leaves and orange flowers."]}, {"p": ["chanterelle"], "tw": "omphalotus", "name": "Jack-o'-lantern mushroom", "sci": "Omphalotus olearius", "sev": "Poisonous", "tells": ["Chanterelles grow singly from soil; jack-o'-lanterns grow in tight clusters from wood or buried roots.", "Jack-o'-lanterns have true, sharp-edged gills; chanterelles have blunt, forking ridges.", "Chanterelle flesh is white inside; jack-o'-lantern flesh is orange."], "local": "Jack-o'-lantern mushroom"}, {"p": ["porcini"], "tw": "rubroboletus", "name": "Devil's bolete", "sci": "Rubroboletus satanas", "sev": "Poisonous", "tells": ["Devil's bolete has red pores and a red-netted stem; porcini pores are white to yellow-green.", "Its flesh turns blue when cut; porcini flesh stays white."], "local": "Devil's bolete"}, {"p": ["puffball"], "tw": "amanita", "name": "Death cap (young 'egg')", "sci": "Amanita phalloides", "sev": "Deadly", "tells": ["Cut every puffball in half: a puffball is pure white and uniform inside.", "A young Amanita shows the outline of a cap, gills and stem inside the 'egg'.", "Death caps kill; there is no safe amount."], "local": "Death cap (young 'egg')"}], "COURSES": [["drink", "Drinks"], ["starter", "Starters & snacks"], ["side", "Sauces, preserves & sides"], ["main", "Main course"], ["bread", "Breads & baking"], ["dessert", "Desserts"]], "TIP": null, "rules": [["100% sure or don't eat it.", "Check the leaf, stem, flower, smell and root. If one feature is off, leave it."], ["Learn from an expert.", "Join a guided foraging walk; local foragers know the lookalikes."], ["Try one new food at a time,", "a small cooked portion, then wait a day."], ["Avoid pollution:", "busy roads, sprayed verges and parks, industrial land, dog-walking paths, polluted water."], ["Know the land rules.", "National parks mostly ban foraging, or allow small personal amounts of fruit and nuts; national forests usually allow personal use; state parks vary. Check before you pick."], ["Ask before picking", "on private land. Most of the US is private property."], ["Take a third or less", "of a patch, and never dig rare or protected plants such as ginseng or ramps where banned."]], "CREDITS": {"nettle": {"a": "Evelyn Simak", "l": "CC BY-SA 2.0", "s": "https://commons.wikimedia.org/wiki/File:Fen_nettle_(Urtica_dioica_ssp._galeopsifolia)_-_geograph.org.uk_-_5423125.jpg"}, "dandelion": {"a": "Mathieu Kappler", "l": "CC BY-SA 4.0", "s": "https://commons.wikimedia.org/wiki/File:Taraxacum_officinale_in_Remiremont,_France_-_2022-05-03_-_02.j const COURSES=C.COURSES||[["drink","Drinks & juices"],["starter","Starters & snacks"],["side","Chutneys, pickles & raitas"],["main","Main course"],["bread","Breads & rice"],["dessert","Desserts"]];
const isHome=r=>r.h.some(x=>regionsOf().includes(x));
const homeScore=r=>{const rg=regionsOf();if(!r.h.length)return 0;const own=r.h[0]===rg[0]?3:r.h.includes(rg[0])?2:r.h.some(x=>rg.includes(x))?1:0;return own};
const rPlants=r=>r.u.map(id=>P.find(p=>p.id===id)).filter(Boolean);
const rUntil=r=>{const l=rPlants(r).filter(inRegion);return l.length?Math.min(...l.map(untilMonths)):99};
const ingImg=r=>{const pl=rPlants(r).find(p=>CREDITS[p.id]);return pl?`${IP}${pl.id}.webp`:""};
const dishImg=r=>{const sl=dishSlug(r.n),fb=ingImg(r);if(DISHPICS[sl])return {src:DISHPICS[sl].u||`${IP}dish_${sl}.webp`,dish:true};
  if(YTV[sl])return {src:`https://i.ytimg.com/vi/${YTV[sl].id}/mqdefault.jpg`,dish:true,yt:true,fb};return fb?{src:fb,dish:false}:null};

const seasonTxt=r=>{const u=rUntil(r);return u===0?"In season":u<99?"From "+MONTHS[mAt(u)-1]:"Other regions"};
function dishCard(r,label){const im=dishImg(r),u=rUntil(r),i=R.indexOf(r);
  return `<button class="dcard" data-dish="${i}"><span class="dimg${im&&!im.dish?" ing":""}${im&&im.yt?" vid":""}">${im?`<img src="${im.src}" alt="" loading="lazy"${im.yt?` data-fb="${im.fb}" onerror="imgFail(this)"`:""}>`:`<span class="noimg">${esc(r.n.charAt(0))}</span>`}</span>
  <b>${esc(r.n)}</b><span class="dmeta ${!label&&u===0?"now":""}">${label?esc(label):seasonTxt(r)}</span></button>`}
function openDish(i){const r=R[i];if(!r)return;const im=dishImg(r),sl=dishSlug(r.n),dp=DISHPICS[sl],yv=YTV[sl];

   <header><div><span class="tag t-${r.c==="drink"?"fruit":"green"}">${COURSES.find(c=>c[0]===r.c)[1]}</span><h2 id="sh-t" style="margin-top:8px">${esc(r.n)}</h2>${isHome(r)?`<div class="fav" style="margin:4px 0 0">${esc(state.st)} favourite</div>`:""}</div><button class="close" id="sclose" aria-label="Close">✕</button></header>

   ${yv?`<figure class="hero vbox"><button class="vplay" id="vplay" aria-label="Play the ${esc(r.n)} recipe video"><img class="heroimg" src="https://i.ytimg.com/vi/${yv.id}/hqdefault.jpg" alt="" data-fb="${ingImg(r)}" onerror="imgFail(this)"><span class="pbadge" aria-hidden="true"></span></button>
     <figcaption>Video: <a href="https://www.youtube.com/watch?v=${yv.id}" target="_blank" rel="noopener">${esc(yv.ch)}</a> on YouTube</figcaption></figure>`
    :(!dp&&im?`<figure class="hero"><img class="heroimg" src="${im.src}" alt="${esc(r.n)}"><figcaption>Shown: the wild ingredient</figcaption></figure>`:"")}
   <div class="photo-links"><a class="btn primary" href="${yv?`https://www.youtube.com/watch?v=${yv.id}`:ytURL(r.yt)}" target="_blank" rel="noopener">▶ ${yv?"Watch on YouTube":"Find a recipe video"}</a>${waShare(r.n+": a wild food recipe from Forage "+C.name,`dishes/${sl}/`)}</div>

  VIEWS.forEach(x=>{$("#v-"+x).hidden=x!==v});

  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+v?"page":"false"));

const EN_M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const trS=t=>{const D=I18N[LG];if(!D)return t;if(D[t]!=null&&typeof D[t]==="string")return D[t];
  const cn=x=>D._c[x]||x;const mm=x=>x.replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g,m=>D._m[EN_M.indexOf(m)]);

  if(EN_M.includes(t))return D._m[EN_M.indexOf(t)];
  if(/(^| · |, )(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)(, (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec))*$/.test(t))return mm(t);
  return t};

const trNode=root=>{if(LG==="en"||!root)return;trBusy=true;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode;return p&&(p.closest&&p.closest("script,style,.notr"))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
