raging", "raspberry": "wild raspberry foraging", "bilberry": "bilberry foraging", "lingonberry": "lingonberry foraging", "cloudberry": "cloudberry foraging", "strawberry": "wild strawberry foraging", "crowberry": "crowberry foraging", "cranberry": "bog cranberry foraging", "blackcurrant": "wild blackcurrant foraging", "rosehip": "rose hips foraging", "rowan": "rowan berries foraging", "elderberry": "elderberry foraging", "elderflower": "elderflower foraging", "seabuckthorn": "sea buckthorn foraging", "juniper": "juniper berries foraging", "hazelnut": "hazelnut foraging", "meadowsweet": "meadowsweet foraging", "thyme": "wild thyme foraging", "yarrow": "yarrow foraging", "redclover": "red clover foraging"}, "YT_M": {}, "HARVEST_T": {"green": "Pinch off young tips and top leaves before the plant flowers, when they are tender and mild. Leave the roots and lower leaves so it regrows. Pick away from roads, sprayed verges and dog-walking paths.", "fruit": "Pick only fully ripe fruit that comes away easily, into a shallow container so it doesn't crush. Leave plenty on the plant for birds and wildlife.", "root": "Only dig roots where you have the landowner's permission, since uprooting wild plants is illegal in many places. Take a few from a large patch and backfill the hole.", "starch": "Tap or collect only from healthy, mature trees, and only in the short season the sap runs. Remove taps afterwards so the tree can heal.", "nut": "Gather nuts from the ground once they fall, discarding any with holes or mould. Leave plenty for wildlife, which depends on them for winter.", "flower": "Pick flowers on a dry, sunny morning once the dew has gone, when the scent is strongest. Take a few heads from each plant so it can still set fruit.", "grain": "Shake or strip ripe seed heads into a bag when they rattle and fall easily. Winnow out the chaff in a breeze.", "fungi": "Twist or cut mushrooms at the base, brush off soil in the woods and carry them in a basket, never a plastic bag. Only take ones you're 100% sure of, leave old and very young ones, and follow local limits.", "protein": "Check local rules, licences, size limits and water-quality warnings before taking any shellfish or fish."}, "HARVEST": {"nettle": "Wear gloves and snip the top four to six leaves of young plants before they flower. Cut back old patches in early summer for a second crop of tender tips.", "wildgarlic": "Pick one or two leaves per plant by hand, crush one to check the garlic smell, and leave the bulbs. Flowers and green seed pods are good later.", "dandelion": "Pick young leaves from plants not yet in flower; flowers on a sunny morning when fully open; dig roots in autumn with permission.", "groundelder": "Pick the shiny, folded young leaves before the plant flowers; check for the triangular, unspotted stem.", "chickweed": "Snip the soft top few centimetres with scissors, leaving the roots so it regrows within weeks.", "sorrel": "Pick young leaves from the base before the plant sends up its flower spike.", "woodsorrel": "Pinch off a few leaves and flowers from large patches; never pull up the creeping roots.", "spruce": "Pick the bright new tips once the brown papery caps fall off, a few from each branch, spread across many trees.", "seabeet": "Pick the younger leaves from the centre; leave the plant and its root in place.", "woodruff": "Snip stems just before flowering and let them wilt for a few hours to release the vanilla scent.", "raspberry": "Pick berries that slip off their core with no tug, into a shallow container.", "bilberry": "Pick by hand or with a berry comb from the low shrubs; the comb is not allowed everywhere, so check local rules.", "lingonberry": "Pick ripe red clusters from late August; berries keep well because they are naturally preserved.", "cloudberry": "Pick when amber and soft, with the green husk easily separated; check whether picking is restricted on that land.", "strawberry": "Pick the tiny berries when fully red and soft; leave plants and runners undisturbed.", "elderberry": "Cut whole drooping clusters when every berry is dark purple; strip off stalks with a fork before cooking.", "elderflower": "Cut fully open, creamy flower heads on a sunny morning; smell them and use the same day. Leave plenty for berries.", "rosehip": "Pick firm, bright red hips after a frost, from many bushes; leave plenty for birds.", "rowan": "Cut whole clusters when bright orange-red; freezing them overnight reduces the bitterness.", "seabuckthorn": "Cut whole small branches with secateurs where allowed, freeze them, then shake or knock off the berries.", "cranberry": "Pick red berries from the bog surface in autumn; stay on boardwalks where they exist.", "crowberry": "Strip the black berries from the mats with a berry comb or by hand.", "blackcurrant": "Strip ripe strings of berries in midsummer.", "gooseberry": "Pick when berries soften and colour; wear gloves against the spines.", "juniper": "Pick only the blue-black, ripe berries (two years old), leaving green ones to ripen.", "hazelnut": "Pick nuts as husks turn brown and the nut slips out, before squirrels get them; or gather fallen nuts.", "meadowsweet": "Cut flower heads when just open on a dry day.", "thyme": "Snip the top few centimetres of shoots in flower, never pulling up the plant.", "yarrow": "Snip young leaves in spring and flower heads in summer.", "redclover": "Pick fresh pink heads in full bloom, avoiding brown ones.", "dulse": "Cut fronds with scissors at low tide, leaving the base attached so it regrows.", "kelp": "Cut the blade above the stipe at spring low tides, never pulling up the holdfast.", "mussel": "Twist mussels off rocks at low tide, taking only large ones, and check local toxin warnings first.", "chanterelle": "Cut or twist at the base, brush off soil and needles on the spot, and leave small ones to grow.", "porcini": "Twist out firm, young specimens; slice in half on the spot to check for maggots.", "puffball": "Cut only young, pure-white, firm puffballs; slice each in half to check it's white all through.", "chickenwoods": "Cut the soft outer edges of young brackets with a knife, leaving the tough base on the tree.", "hedgehog": "Cut at the base and brush off the spines' debris; leave small ones to spread spores.", "birchsap": "Drill a small hole a few centimetres deep, collect for a few days only, then plug the hole with a twig.", "periwinkle": "Pick winkles from rocks at low tide, leaving the small ones.", "cleavers": "Pick the soft tops in early spring before they get bristly.", "deadnettle": "Pick the top few leaves and flowers; no gloves needed.", "lambslettuce": "Cut whole small rosettes at ground level in late winter.", "wildcherry": "Pick ripe cherries before the birds do, from low branches.", "birdcherry": "Pick ripe black clusters in late summer; remember to cook them.", "heather": "Snip flowering tips in late summer.", "sealettuce": "Pick fresh green sheets in rock pools, leaving the holdfast.", "icelandmoss": "Gather small amounts by hand from clean upland areas, leaving most of the patch.", "rugosa": "Pick firm red hips in late summer; wear gloves against the prickles."}, "METHODS": [{"id": "dry", "name": "Dry herbs and greens", "keeps": "Keeps 6–12 months", "steps": ["Shake off insects and dirt; wash only if needed and dry well.", "Hang in small bunches or spread thinly on a screen in a warm, airy place out of direct sun.", "When leaves crumble, strip them from the stems.", "Store in airtight jars in the dark."]}, {"id": "freeze", "name": "Blanch and freeze", "keeps": "Keeps 8–12 months", "steps": ["Wash and trim.", "Plunge into boiling water for 1–2 minutes, then into ice water.", "Squeeze or drain dry and pack into portions.", "Freeze flat in bags so they thaw fast."]}, {"id": "jam", "name": "Jam, jelly and fruit cheese", "keeps": "Keeps a year unopened", "steps": ["Simmer fruit with a little water until soft; strain through a cloth for jelly.", "Add sugar (about equal weight for jam) and boil hard to setting point.", "Pour into hot sterilised jars and seal.", "Crab apples add pectin to low-pectin berries."]}, {"id": "cordial", "name": "Cordials and syrups", "keeps": "Keeps 2–3 months in the fridge; a year frozen", "steps": ["Steep flowers in cold water overnight, or simmer berries and strain.", "Dissolve sugar into the liquid with lemon or citric acid.", "Bottle hot into sterilised bottles.", "Dilute about 1 to 10 with water or sparkling water."]}, {"id": "infuse", "name": "Infused vinegar, oil and pesto", "keeps": "Vinegar keeps a year; pesto 3 months frozen", "steps": ["Pack fresh herbs or flowers loosely into a jar.", "Cover with vinegar and leave 2–4 weeks in the dark, then strain.", "For pesto, blend leaves with oil, nuts and salt and freeze in ice-cube trays.", "Never store fresh garlic or herbs in oil at room temperature."]}, {"id": "pickle", "name": "Pickle and ferment", "keeps": "Keeps 6–12 months", "steps": ["Pack shoots, buds or roots tightly into a clean jar.", "Cover with hot spiced vinegar brine, or with 2% salt brine to ferment.", "Keep vegetables under the liquid with a weight.", "Ferments are ready in 1–3 weeks; move to the fridge."]}, {"id": "nuts", "name": "Cure and store nuts", "keeps": "Keeps 6–12 months", "steps": ["Remove husks; float nuts in water and discard any that float.", "Dry in the shell in a single layer in an airy, rodent-proof place for 2–4 weeks.", "Store cool and dry; shell as needed.", "Freeze shelled nuts to stop them going rancid."]}, {"id": "leach", "name": "Leach acorns", "keeps": "Flour keeps 6 months frozen", "steps": ["Shell and chop or grind acorns.", "Soak in cold water, changing it daily, until the bitterness is gone (several days), or boil in changes of water.", "Dry the meal at low heat.", "Grind to flour for breads and pancakes."]}, {"id": "roots", "name": "Store roots", "keeps": "Keeps 2–4 months", "steps": ["Don't wash; brush off soil and let skins dry.", "Pack in damp sand or sawdust in a box.", "Keep cold and dark, just above freezing.", "Check monthly and remove any soft ones."]}, {"id": "detox", "name": "Make it safe to eat", "keeps": "Do this every time", "steps": ["Nettles: cooking, blanching or drying removes the sting.", "Fiddleheads: boil 15 minutes and discard the water before eating.", "Elderberries: always cook them; raw berries, leaves and stems cause sickness.", "Acorns: leach out the tannins before eating."]}], "DANGER": [["Hemlock", "Conium maculatum", "Tall, purple-blotched, hollow stems and lacy leaves; smells mousy. Deadly."], ["Hemlock water-dropwort", "Oenanthe crocata", "Celery-like plant of wet ditches with white umbels. One of the most poisonous plants in Europe."], ["Lily of the valley", "Convallaria majalis", "Paired leaves and white bells, mistaken for wild garlic. Affects the heart."], ["Autumn crocus", "Colchicum autumnale", "Glossy spring leaves in meadows, mistaken for wild garlic. Deadly."], ["Foxglove", "Digitalis purpurea", "Soft hairy leaf rosettes before flowering can be confused with comfrey. Affects the heart."], ["Yew", "Taxus baccata", "Flat soft needles and red berries. Seeds and foliage are deadly."], ["Deadly nightshade", "Atropa belladonna", "Shiny black cherry-like berries in a green star. Deadly."], ["Giant hogweed", "Heracleum mantegazzianum", "Huge umbels; sap causes severe burns in sunlight."], ["Other wild mushrooms", "Death cap, destroying angel, deadly webcap", "Only eat the mushrooms in this guide, start with the five beginner ones, and only when you are 100% sure. Take anything else to an expert or a mushroom check."]], "LOOK": [{"p": ["wildgarlic"], "tw": "convallaria", "name": "Lily of the valley", "sci": "Convallaria majalis", "sev": "Deadly", "tells": ["Wild garlic leaves smell strongly of garlic when crushed. Lily of the valley smells of nothing.", "Wild garlic leaves grow singly on their own stalk; lily of the valley comes in pairs wrapped around one stem.", "Wash your hands between leaves, or you'll smell garlic on everything."], "local": "Lily of the valley"}, {"p": ["wildgarlic"], "tw": "colchicum", "name": "Autumn crocus", "sci": "Colchicum autumnale", "sev": "Deadly", "tells": ["Autumn crocus leaves are thick, stiff and glossy in a tight bunch, with no garlic smell.", "They appear in spring in damp meadows, which is also where wild garlic grows near woods."], "local": "Autumn crocus"}, {"p": ["wildgarlic"], "tw": "arum", "name": "Lords-and-ladies", "sci": "Arum maculatum", "sev": "Poisonous", "tells": ["Arum leaves are arrow-shaped with a network of veins, often dark-spotted.", "Wild garlic has parallel veins and smells of garlic."], "local": "Lords-and-ladies"}, {"p": ["elderflower", "elderberry", "groundelder", "sweetcicely", "angelica"], "tw": "conium", "name": "Hemlock", "sci": "Conium maculatum", "sev": "Deadly", "tells": ["Elder is a woody shrub; hemlock is a soft plant with hollow stems.", "Hemlock stems are smooth with purple blotches and smell mousy.", "Ground elder has leaves in threes on a triangular, unspotted stem."], "local": "Hemlock"}, {"p": ["groundelder"], "tw": "oenanthe", "name": "Hemlock water-dropwort", "sci": "Oenanthe crocata", "sev": "Deadly", "tells": ["Grows in the same wet ditches as watercress.", "It has celery-like, divided leaves and white umbels; watercress has rounded leaflets and small white four-petalled flowers.", "Its roots look like pale fingers; one root can kill."], "local": "Hemlock water-dropwort"}, {"p": ["bilberry"], "tw": "vacciniumul", "name": "Bog bilberry", "sci": "Vaccinium uliginosum", "sev": "Mild", "tells": ["Bilberry stems are green and angled; bog bilberry has round brown stems and blue-grey leaves.", "Bog bilberry flesh is pale, bilberry is purple right through.", "Bog bilberry is edible but can cause headaches in large amounts."], "local": "Bog bilberry"}, {"p": ["spruce"], "tw": "taxus", "name": "Yew", "sci": "Taxus baccata", "sev": "Deadly", "tells": ["Spruce needles are stiff, square in section and grow all round the twig.", "Yew needles are flat, soft and dark, in two rows, with a paler underside.", "Yew has red cup-shaped berries."], "local": "Yew"}, {"p": ["chanterelle"], "tw": "omphalotus", "name": "Jack-o'-lantern mushroom", "sci": "Omphalotus olearius", "sev": "Poisonous", "tells": ["Chanterelles grow singly from soil; jack-o'-lanterns grow in tight clusters from wood or buried roots.", "Jack-o'-lanterns have true, sharp-edged gills; chanterelles have blunt, forking ridges.", "Chanterelle flesh is white inside; jack-o'-lantern flesh is orange."], "local": "Jack-o'-lantern mushroom"}, {"p": ["chanterelle"], "tw": "cortinarius", "name": "Deadly webcap", "sci": "Cortinarius rubellus", "sev": "Deadly", "tells": ["Deadly webcap is rusty orange-brown with true gills and a cobwebby veil when young.", "It damages the kidneys days later. Never pick orange-brown gilled mushrooms."], "local": "Deadly webcap"}, {"p": ["porcini"], "tw": "rubroboletus", "name": "Devil's bolete", "sci": "Rubroboletus satanas", "sev": "Poisonous", "tells": ["Devil's bolete has red pores and a red-netted stem; porcini pores are white to yellow-green.", "Its flesh turns blue when cut; porcini flesh stays white."], "local": "Devil's bolete"}, {"p": ["puffball"], "tw": "amanita", "name": "Death cap (young 'egg')", "sci": "Amanita phalloides", "sev": "Deadly", "tells": ["Cut every puffball in half: a puffball is pure white and uniform inside.", "A young Amanita shows the outline of a cap, gills and stem inside the 'egg'.", "Death caps kill; there is no safe amount."], "local": "Death cap (young 'egg')"}, {"p": ["morel"], "tw": "gyromitra", "name": "False morel", "sci": "Gyromitra esculenta", "sev": "Deadly", "tells": ["Slice it in half: a true morel is one continuous hollow chamber.", "False morels are brain-like and wrinkled, not pitted, and stuffed with cottony fibres."], "local": "False morel"}, {"p": ["oystermush"], "tw": "pleurocybella", "name": "Angel wings", "sci": "Pleurocybella porrigens", "sev": "Poisonous", "tells": ["Angel wings are thin, pure white and grow on conifer wood.", "Oyster mushrooms are thicker, grey-brown to cream, on hardwoods."], "local": "Angel wings"}, {"p": ["shaggymane"], "tw": "coprinopsis", "name": "Common inkcap", "sci": "Coprinopsis atramentaria", "sev": "Harmful", "tells": ["Shaggy inkcap is tall, white and covered in shaggy scales.", "The common inkcap is smaller, smooth and grey-brown, in clusters; with alcohol, even days later, it causes violent sickness."], "local": "Common inkcap"}, {"p": ["saffronmilkcap"], "tw": "lactarius", "name": "Woolly milk cap", "sci": "Lactarius torminosus", "sev": "Poisonous", "tells": ["Saffron milk caps bleed carrot-orange milk and bruise green.", "The woolly milk cap has white milk and a shaggy, woolly cap edge, under birch."], "local": "Woolly milk cap"}, {"p": ["blewit"], "tw": "cortinarius", "name": "Webcaps", "sci": "Cortinarius spp.", "sev": "Deadly", "tells": ["Wood blewits have a pinkish spore print and no cobweb veil.", "Webcaps leave a rusty brown spore print and have a cobweb-like veil when young."], "local": "Webcaps"}], "COURSES": [["drink", "Drinks"], ["starter", "Starters & snacks"], ["side", "Sauces, preserves & sides"], ["main", "Main course"], ["bread", "Breads & baking"], ["dessert", "Desserts"]], "TIP": null, "rules": [["100% sure or don't eat it.", "Check the leaf, stem, flower, smell and root. If one feature is off, leave it."], ["Learn from an expert.", "Join a guided foraging walk; local foragers know the lookalikes."], ["Try one new food at a time,", "a small cooked portion, then wait a day."], ["Avoid pollution:", "busy roads, sprayed verges and parks, industrial land, dog-walking paths, polluted water."], ["Allemannsretten:", "you may pick wild berries, mushrooms and flowers on uncultivated land, but not dig up plants or take from gardens or crop fields."], ["Cloudberries are special:", "in Nordland, Troms and Finnmark landowners can ban picking clo const nrm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
const lev=(a,b,max)=>{if(Math.abs(a.length-b.length)>max)return max+1;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const c=[i];let best=i;for(let j=1;j<=b.length;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));if(c[j]<best)best=c[j]}if(best>max)return max+1;p=c}return p[b.length]};
const SIDX=(()=>{const byId=Object.fromEntries(P.map(p=>[p.id,p]));
 const pl=P.map(p=>({k:"p",p,f:[[nrm(p.name),10],[nrm(p.local),6],[nrm(p.sci),5],[nrm(TYPES[p.type]||p.type),2]]}));
 const ds=R.map((r,i)=>({k:"d",r,i,f:[[nrm(r.n),10],[nrm((r.u||[]).map(u=>byId[u]?byId[u].name+" "+byId[u].local:u).join(" ")),5],[nrm(r.d),2]]}));
 return pl.concat(ds)})();
function sScore(it,q,qw){let s=0;for(const [f,w] of it.f){if(!f)continue;if(f===q)s=Math.max(s,w*12);else if(f.startsWith(q))s=Math.max(s,w*10);else if((" "+f).includes(" "+q))s=Math.max(s,w*8);else if(f.includes(q))s=Math.max(s,w*5);
  else if(qw.every(x=>f.includes(x)))s=Math.max(s,w*4);
  else{const fw=f.split(" ");let ok=0;for(const x of qw){if(x.length<4)continue;const m=x.length>6?2:1;if(fw.some(y=>lev(x,y.slice(0,x.length+1),m)<=m||lev(x,y,m)<=m))ok++}if(ok&&ok===qw.filter(x=>x.length>=4).length)s=Math.max(s,w*2)}}
 return s}

async function otherCountries(q,qw){try{if(!GIDX)GIDX=await fetch("../search-index.json").then(r=>r.json())}catch(e){return []}
 const out=[];for(const [c,v] of Object.entries(GIDX)){if(c===C.code)continue;let n=0,first=null;
  for(const [id,name,loc,sci] of v.p){const f=nrm(name+" "+loc+" "+sci);if(f.includes(q)||qw.every(x=>f.includes(x))){n++;first=first||["p",id,name]}}
  for(const [sl,name] of v.d){if(nrm(name).includes(q)){n++;first=first||["d",sl,name]}}
  if(n)out.push([c,v.n,v.f,n,first])}
 return out.sort((a,b)=>b[3]-a[3]).slice(0,6)}
function renderSearch(){const raw=$("#sq").value,q=nrm(raw),box=$("#sres");
 if(q.length<2){box.innerHTML=`<p class="sres-hint">Try a plant, a local name or a dish: <button class="chip" data-sq="nettle">nettle</button> <button class="chip" data-sq="berries">berries</button> <button class="chip" data-sq="soup">soup</button></p>`;return}
 const qw=q.split(" ");const hits=SIDX.map(it=>[it,sScore(it,q,qw)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||((a[0].k==="p"?inSeason(a[0].p):0)<(b[0].k==="p"?inSeason(b[0].p):0)?1:-1));
 const ps=hits.filter(h=>h[0].k==="p").slice(0,12).map(h=>h[0].p),rs=hits.filter(h=>h[0].k==="d").slice(0,12).map(h=>h[0]);
 const pRow=p=>`<button class="sr" data-open="${p.id}"><img src="${IP}${p.id}.webp" alt="" loading="lazy"><span><b>${esc(p.name)}</b><small>${esc(p.local||p.sci)}</small></span>${inSeason(p)&&inRegion(p)?`<em class="sr-tag">In season</em>`:inRegion(p)?"":`<em class="sr-tag off">Not in your area</em>`}</button>`;
 const dRow=x=>{const im=dishImg(x.r)||{src:""};return `<button class="sr" data-dish="${x.i}"><img src="${im.src}" alt="" loading="lazy"${im.fb?` data-fb="${im.fb}" onerror="this.onerror=null;this.src=this.dataset.fb"`:""}><span><b>${esc(x.r.n)}</b><small>${esc(COURSES.find(c=>c[0]===x.r.c)[1])}</small></span>${rUntil(x.r)===0?`<em class="sr-tag">In season</em>`:""}</button>`};
 box.innerHTML=(ps.length?`<h3 class="sres-h">Wild foods</h3>${ps.map(pRow).join("")}`:"")+(rs.length?`<h3 class="sres-h">Recipes</h3>${rs.map(dRow).join("")}`:"")+(ps.length||rs.length?"":`<p class="sres-hint">No matches in ${esc(C.the||C.name)}.</p>`)+`<div id="sres-other"></div>`;
 const tok=raw;if(ps.length+rs.length<3)otherCountries(q,qw).then(o=>{if($("#sq").value!==tok||!o.length)return;const el=$("#sres-other");if(!el)return;
  el.innerHTML=`<h3 class="sres-h">Found in other countries</h3>`+o.map(([c,n,f,k,fi])=>`<a class="sr" href="../${c}/#${fi[0]}/${encodeURIComponent(fi[1])}"><span class="flag notr sr-flag">${f}</span><span><b>${esc(n)}</b><small>${k} match${k>1?"es":""}, e.g. ${esc(fi[2])}</small></span></a>`).join("")})}
