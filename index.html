/* Layout: Airbnb-style explore page: sticky search bar, category tabs, photo-card grid grouped by season */
:root{--bg:#fff;--fg:#141a16;--muted:#5e6b63;--line:#dde3df;--sunk:#f1f4f2;--green:#00733a;--brand:#00bf63;--moss:#e6f7ee;--shadow:0 1px 2px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
--display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--fg:#e8eeea;--muted:#9aa69f;--line:#2a332e;--sunk:#1c2420;--green:#3ddc84;--moss:#183225;--shadow:0 1px 2px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
a{color:inherit}button{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;height:80px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font:700 1.25rem var(--display);flex:none}.brand img{width:34px;height:34px}.brand span{color:var(--green)}
.pill{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);background:var(--bg);height:56px;padding:0 8px 0 24px;position:relative}
.pill label{display:flex;flex-direction:column;flex:1;min-width:0;cursor:text}
.pill small{font-size:.72rem;font-weight:700}
.pill input{border:0;background:none;font:inherit;color:var(--fg);padding:2px 0;outline:none;width:100%}
.pill input::placeholder{color:var(--muted)}
.pill .div{width:1px;height:28px;background:var(--line);margin:0 16px}
.pill select{border:0;background:none;font:inherit;color:var(--fg);padding:2px 0;cursor:pointer}
.go{width:40px;height:40px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none;margin-left:8px;cursor:pointer}
.go svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4}
.sugg{position:absolute;left:0;right:0;top:64px;background:var(--bg);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:8px;display:none;max-height:60vh;overflow:auto}
.sugg.on{display:block}
.sugg a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;text-decoration:none}
.sugg a:hover,.sugg a:focus{background:var(--sunk);outline:none}
.sugg .ic{width:44px;height:44px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;flex:none}
.sugg .ic svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8}
.sugg b{display:block}.sugg span{color:var(--muted);font-size:.85rem}
.cats{display:flex;gap:32px;overflow-x:auto;scrollbar-width:none;padding:14px 0 0}
.cats::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 0 12px;border:0;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;flex:none;font-size:.8rem;font-weight:700}
.cat svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cat:hover{color:var(--fg);border-bottom-color:var(--line)}
.cat[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.cat:focus-visible,.go:focus-visible,.card:focus-visible,.heart:focus-visible{outline:2px solid var(--green);outline-offset:2px}
main{padding:24px 0 56px}
h2{font:700 1.35rem var(--display);margin:24px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:40px 24px}
.card{text-decoration:none;display:block;position:relative;min-width:0}
.ph{position:relative;aspect-ratio:20/19;border-radius:14px;overflow:hidden;background:var(--sunk)}
.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6)}.dots i:first-child{background:#fff}
.badge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.95);color:#141a16;font-weight:700;font-size:.8rem;padding:5px 10px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.heart{position:absolute;top:10px;right:10px;width:34px;height:34px;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.heart svg{width:26px;height:26px;fill:rgba(0,0,0,.45);stroke:#fff;stroke-width:2}
.heart[aria-pressed="true"] svg{fill:#e5484d}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.meta b{font-weight:700;font-size:1rem}
.meta .n{white-space:nowrap;font-variant-numeric:tabular-nums}
.line{color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line strong{color:var(--fg);font-weight:700}
.empty{color:var(--muted);padding:24px 0}
footer{border-top:1px solid var(--line);background:var(--sunk);padding:28px 0 calc(40px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:.85rem}
@media (max-width:744px){
 .top{height:auto;padding:14px 0 0;flex-wrap:wrap}.brand{display:none}
 .pill{max-width:none;height:56px}
 .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
 .cats{gap:24px}
 .grid{grid-template-columns:1fr;gap:32px}
 .pill .div,.pill .month small{display:none}.pill .month{flex:none}
}
@media (prefers-reduced-motion:reduce){.slides{scroll-behavior:auto}}

const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const CATS=[["all","All","M4 6h16M4 12h16M4 18h16"],["fruit","Berries","M12 7c-3 0-5 2.2-5 5.2S9 19 12 19s5-3.6 5-6.8S15 7 12 7zM12 7c0-2 1-3 3-4"],["green","Greens","M5 19C5 10 11 5 20 4c-1 9-6 15-15 15zM5 19l8-8"],["nut","Nuts","M12 4c4 0 7 3 7 7 0 5-4 9-7 9s-7-4-7-9c0-4 3-7 7-7zM5 11h14"],["fungi","Mushrooms","M3 12a9 6 0 0 1 18 0zM10 12v7h4v-7"],["sea","Seaweed & shore","M3 18c3-2 6 2 9 0s6 2 9 0M8 18c0-5 2-8 0-13M14 18c0-4 3-6 1-11"],["flower","Flowers & teas","M12 9a3 3 0 1 0 0 .01M12 3v3M12 12v9M6 6l2 2M18 6l-2 2M3 9h3M18 9h3"],["root","Roots & shoots","M12 3v18M12 9l-4-3M12 13l4-3M12 17l-3-2"]];
const SEA=new Set(["dulse","kelp","laver","karengo","carrageen","samphire","seasamphire","seabeet","mussel","periwinkle","pipi"]);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const state={m:new Date().getMonth()+1,cat:"all"};
let saved=new Set((store.get("ftw-saved")||"").split(",").filter(Boolean));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tz=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch(e){return ""}})();
const home=D.find(c=>c.tz&&new RegExp(c.tz).test(tz));
const match=(p,cat)=>cat==="all"||(cat==="sea"?SEA.has(p[0]):p[2]===cat&&!SEA.has(p[0]));
const inSeason=(c,cat)=>c.p.filter(p=>p[3].includes(state.m)&&match(p,cat));
function season(c){const m=state.m,n=[12,1,2].includes(m)?"Winter":[3,4,5].includes(m)?"Spring":[6,7,8].includes(m)?"Summer":"Autumn";const s={Winter:"Summer",Spring:"Autumn",Summer:"Winter",Autumn:"Spring"};return c.south?s[n]:n}
function card(c){const L=inSeason(c,state.cat);const pics=L.filter(p=>p[4]).slice(0,4);const imgs=[...new Set([c.sig,...pics.map(p=>p[4])].filter(Boolean))].slice(0,5);
 const names=L.slice(0,3).map(p=>p[1]);const href=c.href;
 return `<a class="card" href="${href}" data-c="${c.code}">
  <div class="ph"><div class="slides">${imgs.map((id,i)=>`<img src="${id}" alt="${i?"":esc(c.name)}" loading="lazy">`).join("")}</div>
   ${imgs.length>1?`<div class="dots">${imgs.map(()=>"<i></i>").join("")}</div>`:""}
   ${c===home?`<span class="badge">Near you</span>`:""}
   <button class="heart" type="button" data-save="${c.code}" aria-label="Save ${esc(c.name)}" aria-pressed="${saved.has(c.code)}"><svg viewBox="0 0 32 32"><path d="M16 28c7-4.7 14-10 14-17a7 7 0 0 0-14-2 7 7 0 0 0-14 2c0 7 7 12.3 14 17z"/></svg></button></div>
  <div class="meta"><b>${esc(c.name)}</b><span class="n">${L.length} in season</span></div>
  <div class="line">${names.length?esc(names.join(", ")):"Quiet month, see what's coming"}</div>
  <div class="line">${season(c)} · <strong>${c.p.length} wild foods</strong></div></a>`}
function render(){
 const list=D.filter(c=>state.cat==="all"||inSeason(c,state.cat).length);
 const groups=[];
 if(saved.size)groups.push(["Saved","Your saved guides",list.filter(c=>saved.has(c.code))]);
 if(home&&list.includes(home))groups.push(["Near you",`What's wild in ${home.name} in ${MON[state.m-1]}`,[home]]);
 const rest=list.filter(c=>c!==home&&!saved.has(c.code));
 const north=rest.filter(c=>!c.south),south=rest.filter(c=>c.south);
 const by=a=>a.sort((x,y)=>inSeason(y,state.cat).length-inSeason(x,state.cat).length);
 if(north.length)groups.push([`${season(north[0])} up north`,`Most in season first, for ${MON[state.m-1]}`,by(north)]);
 if(south.length)groups.push([`${season(south[0])} down south`,"Seasons are flipped in the southern hemisphere",by(south)]);
 document.getElementById("main").innerHTML=groups.filter(g=>g[2].length).map(([h,s,cs])=>`<section><h2>${h}</h2><p class="sub">${s}</p><div class="grid">${cs.map(card).join("")}</div></section>`).join("")||`<p class="empty">Nothing in this category in ${MON[state.m-1]}. Try another month.</p>`;
 document.querySelectorAll(".slides").forEach(sl=>sl.addEventListener("scroll",()=>{const i=Math.round(sl.scrollLeft/sl.clientWidth);sl.parentNode.querySelectorAll(".dots i").forEach((d,k)=>d.style.background=k===i?"#fff":"rgba(255,255,255,.6)")},{passive:true}));
}
document.getElementById("cats").innerHTML=CATS.map(([k,l,d])=>`<button class="cat" data-cat="${k}" aria-pressed="${k==="all"}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>${l}</button>`).join("");
const ms=document.getElementById("m");MON.forEach((m,i)=>ms.add(new Option(m,i+1,false,i+1===state.m)));
ms.onchange=()=>{state.m=+ms.value;render()};
document.addEventListener("click",e=>{
 const c=e.target.closest("[data-cat]");if(c){state.cat=c.dataset.cat;document.querySelectorAll(".cat").forEach(b=>b.setAttribute("aria-pressed",b===c));render();return}
 const h=e.target.closest("[data-save]");if(h){e.preventDefault();const k=h.dataset.save;saved.has(k)?saved.delete(k):saved.add(k);store.set("ftw-saved",[...saved].join(","));render();return}
 const s=e.target.closest(".sugg a");if(s&&s.dataset.st){store.set(s.dataset.code==="in"?"fi-state":"fi-state-"+s.dataset.code,s.dataset.st)}
 if(!e.target.closest("#pill"))sugg.classList.remove("on");
});
const q=document.getElementById("q"),sugg=document.getElementById("sugg");
const IDX=D.flatMap(c=>[{t:c.name,s:"Country · "+c.p.length+" wild foods",c,st:""},...c.regions.map(r=>({t:r,s:c.name,c,st:r}))]);
const pin='<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
function showSugg(){const v=q.value.trim().toLowerCase();const hits=(v?IDX.filter(x=>x.t.toLowerCase().includes(v)):IDX.filter(x=>!x.st)).slice(0,8);
 sugg.innerHTML=hits.map(x=>`<a href="${x.c.href}" data-code="${x.c.code}" data-st="${esc(x.st)}" role="option"><span class="ic">${pin}</span><span><b>${esc(x.t)}</b><span>${esc(x.s)}</span></span></a>`).join("")||`<p class="sub" style="padding:8px 12px">No match. Try a country name.</p>`;sugg.classList.add("on")}
q.addEventListener("focus",showSugg);q.addEventListener("input",showSugg);
document.getElementById("pill").addEventListener("submit",e=>{e.preventDefault();const a=sugg.querySelector("a");if(a){if(a.dataset.st)store.set(a.dataset.code==="in"?"fi-state":"fi-state-"+a.dataset.code,a.dataset.st);location.href=a.href}});
render();
</script>
