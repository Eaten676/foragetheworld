const LGX=C.lang&&I18N[C.lang]?C.lang:null;
let LG=(()=>{if(!LGX)return "en";const s=store.get("fi-lang");if(s)return s;return (navigator.language||"").toLowerCase().startsWith(LGX==="nb"?"n":LGX)?LGX:"en"})();
const EN_M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const trS=t=>{const D=I18N[LG];if(!D)return t;if(D[t]!=null&&typeof D[t]==="string")return D[t];
  const cn=x=>D._c[x]||x;const mm=x=>x.replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g,m=>D._m[EN_M.indexOf(m)]);
  for(const [re,rep] of D._p){if(re.test(t)){return mm(t.replace(re,rep).replace(/\$C/g,"")).replace(new RegExp(Object.keys(D._c).join("|")||"^$"),cn)}}
  if(EN_M.includes(t))return D._m[EN_M.indexOf(t)];
  if(/(^| · |, )(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)(, (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec))*$/.test(t))return mm(t);
  return t};
let trBusy=false;
const trNode=root=>{if(LG==="en"||!root)return;trBusy=true;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode;return p&&(p.closest&&p.closest("script,style,.notr"))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
  let n;while(n=w.nextNode()){const v=n.nodeValue,t=v.trim();if(!t||!/[A-Za-z]/.test(t))continue;const r=trS(t);if(r!==t)n.nodeValue=v.replace(t,r)}
  if(root.querySelectorAll)root.querySelectorAll("[placeholder],[aria-label],[title]").forEach(e=>{for(const a of ["placeholder","aria-label","title"]){const v=e.getAttribute(a);if(v){const r=trS(v);if(r!==v)e.setAttribute(a,r)}}});
  trBusy=false};
if(LGX){new MutationObserver(ms=>{if(trBusy)return;for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===1)trNode(n);else if(n.nodeType===3&&n.parentNode)trNode(n.parentNode)}}).observe(document.body,{childList:true,subtree:true});
  document.documentElement.lang=LG==="en"?"en":LG;
  const lb=document.createElement("button");lb.className="langbtn notr";lb.type="button";lb.textContent=LG==="en"?(LGX==="nb"?"NO":LGX.toUpperCase()):"EN";lb.title=LG==="en"?I18N[LGX]._n:"English";lb.setAttribute("aria-label","Language");

document.addEventListener("click",e=>{

  const m=e.target.closest("[data-mode]");if(m){state.mode=m.dataset.mode;renderNearList();return}
  const dc=e.target.closest("[data-dish]");if(dc){openDish(+dc.dataset.dish);return}
