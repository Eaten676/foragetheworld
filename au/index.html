strawberrygum": "strawberry gum bush food", "bushonion": "bush onion bush food", "bushbanana": "bush banana bush food", "wildorange": "wild orange bush food", "nativecurrant": "native currant bush food", "appleberry": "apple berry bush food", "clusterfig": "cluster fig bush food", "nativeyam": "long yam bush food", "kurrajong": "kurrajong seeds bush food", "lemonteatree": "lemon-scented tea tree bush food", "nativerosella": "native rosella bush food", "aupipi": "pipis bush food", "abalone": "abalone bush food", "seaurchin": "purple sea urchin bush food", "sealettuce": "sea lettuce bush food", "saffronmilkcap": "saffron milk cap bush food", "slipperyjack": "slippery jack bush food", "fieldmushroom": "field mushroom bush food", "purslane": "munyeroo · purslane bush food", "olive": "feral olive bush food", "dandelion": "dandelion bush food", "nasturtium": "nasturtium bush food", "chickweed": "chickweed bush food", "mallow": "common mallow bush food", "rosehip": "rose hips bush food", "cherryplum": "cherry plum bush food", "threecorner": "three-cornered leek bush food"}, "YT_M": {}, "HARVEST_T": {"green": "Pinch off young tips and top leaves before the plant flowers, when they are tender and mild. Leave the roots and lower leaves so it regrows. Pick away from roads, sprayed verges and dog-walking paths.", "fruit": "Pick only fully ripe fruit that comes away easily, into a shallow container so it doesn't crush. Leave plenty on the plant for birds and wildlife.", "root": "Only dig roots where you have the landowner's permission, since uprooting wild plants is illegal in many places. Take a few from a large patch and backfill the hole.", "starch": "Tap or collect only from healthy, mature trees, and only in the short season the sap runs. Remove taps afterwards so the tree can heal.", "nut": "Gather nuts from the ground once they fall, discarding any with holes or mould. Leave plenty for wildlife, which depends on them for winter.", "flower": "Pick flowers on a dry, sunny morning once the dew has gone, when the scent is strongest. Take a few heads from each plant so it can still set fruit.", "grain": "Shake or strip ripe seed heads into a bag when they rattle and fall easily. Winnow out the chaff in a breeze.", "fungi": "Twist or cut mushrooms at the base, brush off soil in the woods and carry them in a basket, never a plastic bag. Only take ones you're 100% sure of, leave old and very young ones, and follow local limits.", "protein": "Check local rules, licences, size limits and water-quality warnings before taking any shellfish or fish."}, "HARVEST": {"nettle": "Wear gloves and snip the top four to six leaves of young plants before they flower. Cut back old patches in early summer for a second crop of tender tips.", "dandelion": "Pick young leaves from plants not yet in flower; flowers on a sunny morning when fully open; dig roots in autumn with permission.", "chickweed": "Snip the soft top few centimetres with scissors, leaving the roots so it regrows within weeks.", "blackberry": "Pick glossy, fully black berries that come away easily; wear long sleeves and avoid low berries by dog-walking paths.", "rosehip": "Pick firm, bright red hips after a frost, from many bushes; leave plenty for birds.", "mussel": "Twist mussels off rocks at low tide, taking only large ones, and check local toxin warnings first.", "pricklypear": "Use tongs and thick gloves; twist off ripe red fruit and roll them in sand to remove spines.", "warrigal": "Pick young tips and leaves, then blanch before eating.", "fingerlime": "Pick fruit when it comes away easily and the skin feels slightly soft.", "macadamia": "Gather fallen nuts from the ground under planted trees with permission.", "quandong": "Pick bright red fruit when it falls or comes away easily.", "threecorner": "Pull whole invasive plants freely, or snip leaves like chives.", "sealettuce": "Pick fresh green sheets in rock pools, leaving the holdfast."}, "METHODS": [{"id": "dry", "name": "Dry herbs and greens", "keeps": "Keeps 6–12 months", "steps": ["Shake off insects and dirt; wash only if needed and dry well.", "Hang in small bunches or spread thinly on a screen in a warm, airy place out of direct sun.", "When leaves crumble, strip them from the stems.", "Store in airtight jars in the dark."]}, {"id": "freeze", "name": "Blanch and freeze", "keeps": "Keeps 8–12 months", "steps": ["Wash and trim.", "Plunge into boiling water for 1–2 minutes, then into ice water.", "Squeeze or drain dry and pack into portions.", "Freeze flat in bags so they thaw fast."]}, {"id": "jam", "name": "Jam, jelly and fruit cheese", "keeps": "Keeps a year unopened", "steps": ["Simmer fruit with a little water until soft; strain through a cloth for jelly.", "Add sugar (about equal weight for jam) and boil hard to setting point.", "Pour into hot sterilised jars and seal.", "Crab apples add pectin to low-pectin berries."]}, {"id": "cordial", "name": "Cordials and syrups", "keeps": "Keeps 2–3 months in the fridge; a year frozen", "steps": ["Steep flowers in cold water overnight, or simmer berries and strain.", "Dissolve sugar into the liquid with lemon or citric acid.", "Bottle hot into sterilised bottles.", "Dilute about 1 to 10 with water or sparkling water."]}, {"id": "infuse", "name": "Infused vinegar, oil and pesto", "keeps": "Vinegar keeps a year; pesto 3 months frozen", "steps": ["Pack fresh herbs or flowers loosely into a jar.", "Cover with vinegar and leave 2–4 weeks in the dark, then strain.", "For pesto, blend leaves with oil, nuts and salt and freeze in ice-cube trays.", "Never store fresh garlic or herbs in oil at room temperature."]}, {"id": "pickle", "name": "Pickle and ferment", "keeps": "Keeps 6–12 months", "steps": ["Pack shoots, buds or roots tightly into a clean jar.", "Cover with hot spiced vinegar brine, or with 2% salt brine to ferment.", "Keep vegetables under the liquid with a weight.", "Ferments are ready in 1–3 weeks; move to the fridge."]}, {"id": "nuts", "name": "Cure and store nuts", "keeps": "Keeps 6–12 months", "steps": ["Remove husks; float nuts in water and discard any that float.", "Dry in the shell in a single layer in an airy, rodent-proof place for 2–4 weeks.", "Store cool and dry; shell as needed.", "Freeze shelled nuts to stop them going rancid."]}, {"id": "leach", "name": "Leach acorns", "keeps": "Flour keeps 6 months frozen", "steps": ["Shell and chop or grind acorns.", "Soak in cold water, changing it daily, until the bitterness is gone (several days), or boil in changes of water.", "Dry the meal at low heat.", "Grind to flour for breads and pancakes."]}, {"id": "roots", "name": "Store roots", "keeps": "Keeps 2–4 months", "steps": ["Don't wash; brush off soil and let skins dry.", "Pack in damp sand or sawdust in a box.", "Keep cold and dark, just above freezing.", "Check monthly and remove any soft ones."]}, {"id": "detox", "name": "Make it safe to eat", "keeps": "Do this every time", "steps": ["Nettles: cooking, blanching or drying removes the sting.", "Fiddleheads: boil 15 minutes and discard the water before eating.", "Elderberries: always cook them; raw berries, leaves and stems cause sickness.", "Acorns: leach out the tannins before eating."]}], "DANGER": [["Hemlock", "Conium maculatum", "Introduced weed with purple-blotched hollow stems and lacy leaves. Deadly."], ["Gympie-gympie", "Dendrocnide moroides", "Rainforest stinging tree with heart-shaped fuzzy leaves; the sting can hurt for months."], ["Cycad seeds", "Cycas, Macrozamia", "Bright orange or red seeds of palm-like cycads are deadly unless processed by traditional methods."], ["Oleander", "Nerium oleander", "Garden hedge with pink or white flowers. Every part stops the heart."], ["Rosary pea", "Abrus precatorius", "Red-and-black seeds in the tropics; one chewed seed can kill."], ["Castor oil plant", "Ricinus communis", "Weed with hand-shaped leaves and spiny pods; seeds are deadly."], ["Wild mushrooms", "Death cap and others", "Death caps grow under oaks in Canberra and Melbourne. Leave mushrooms to experts."], ["Toxic bush fruit", "Many species", "Plenty of native fruit is poisonous. Learn from Aboriginal-led bush food guides before eating."]], "LOOK": [{"p": ["fennel"], "tw": "conium", "name": "Hemlock", "sci": "Conium maculatum", "local": "Hemlock", "sev": "Deadly", "tells": ["Fennel smells of aniseed; hemlock smells mousy.", "Hemlock stems are smooth with purple blotches; fennel stems are blue-green and unspotted."]}, {"p": ["bushtomato"], "tw": "solanumnig", "name": "Toxic Solanums", "sci": "Solanum species", "local": "Wild nightshades", "sev": "Poisonous", "tells": ["Many bush tomatoes and nightshades are poisonous, especially unripe.", "Only harvest species identified by Aboriginal guides or experts."]}, {"p": ["fieldmushroom", "saffronmilkcap", "slipperyjack"], "tw": "amanita", "name": "Death cap", "sci": "Amanita phalloides", "local": "Death cap", "sev": "Deadly", "tells": ["Death caps grow under oaks in Canberra, Melbourne and Adelaide.", "They have white gills that never turn pink or brown, a ring, and a bag-like cup at the base.", "Field mushrooms grow in open pasture and have pink to brown gills."]}], "COURSES": [["drink", "Drinks"], ["starter", "Starters & snacks"], ["side", "Sauces, preserves & sides"], ["main", "Main course"], ["bread", "Breads & baking"], ["dessert", "Desserts"]], "TIP": null, "rules": [["100% sure or don't eat it.", "Check the leaf, stem, flower, smell and root. If one feature is off, leave it."], ["Learn from an expert.", "Join a guided foraging walk; local foragers know the lookalikes."], ["Try one new food at a time,", "a small cooked portion, then wait a day."], ["Avoid pollution:", "busy roads, sprayed verges and parks, industrial land, dog-walking paths, polluted water."], ["Learn from Traditional Owners.", "Bush foods are Aboriginal and Torres Strait Islander knowledge. Aboriginal-led tours and suppliers are the best way to learn."], ["National parks and reserves", "b const nrm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
const lev=(a,b,max)=>{if(Math.abs(a.length-b.length)>max)return max+1;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const c=[i];let best=i;for(let j=1;j<=b.length;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));if(c[j]<best)best=c[j]}if(best>max)return max+1;p=c}return p[b.length]};
const SIDX=(()=>{const byId=Object.fromEntries(P.map(p=>[p.id,p]));
 const pl=P.map(p=>({k:"p",p,f:[[nrm(p.name),10],[nrm(p.local),6],[nrm(p.sci),5],[nrm(TYPES[p.type]||p.type),2]]}));
 const ds=R.map((r,i)=>({k:"d",r,i,f:[[nrm(r.n),10],[nrm((r.u||[]).map(u=>byId[u]?byId[u].name+" "+byId[u].local:u).join(" ")),5],[nrm(r.d),2]]}));
 return pl.concat(ds)})();
function sScore(it,q,qw){let s=0;for(const [f,w] of it.f){if(!f)continue;if(f===q)s=Math.max(s,w*12);else if(f.startsWith(q))s=Math.max(s,w*10);else if((" "+f).includes(" "+q))s=Math.max(s,w*8);else if(f.includes(q))s=Math.max(s,w*5);
  else if(qw.every(x=>f.includes(x)))s=Math.max(s,w*4);
  else{const fw=f.split(" ");let ok=0;for(const x of qw){if(x.length<4)continue;const m=x.length>6?2:1;if(fw.some(y=>lev(x,y.slice(0,x.length+1),m)<=m||lev(x,y,m)<=m))ok++}if(ok&&ok===qw.filter(x=>x.length>=4).length)s=Math.max(s,w*2)}}
 return s}
let GIDX=null;
async function otherCountries(q,qw){try{if(!GIDX)GIDX=await fetch("../search-index.json").then(r=>r.json())}catch(e){return []}
 const out=[];for(const [c,v] of Object.entries(GIDX)){if(c===C.code)continue;let n=0,first=null;
  for(const [id,name,loc,sci] of v.p){const f=nrm(name+" "+loc+" "+sci);if(f.includes(q)||qw.every(x=>f.includes(x))){n++;first=first||["p",id,name]}}
  for(const [sl,name] of v.d){if(nrm(name).includes(q)){n++;first=first||["d",sl,name]}}
  if(n)out.push([c,v.n,v.f,n,first])}
 return out.sort((a,b)=>b[3]-a[3]).slice(0,6)}
function renderSearch(){const raw=$("#sq").value,q=nrm(raw),box=$("#sres");
 if(q.length<2){box.innerHTML=`<p class="sres-hint">Try a plant, a local name or a dish: <button class="chip" data-sq="nettle">nettle</button> <button class="chip" data-sq="berries">berries</button> <button class="chip" data-sq="soup">soup</button></p>`;return}
 const qw=q.split(" ");const hits=SIDX.map(it=>[it,sScore(it,q,qw)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||((a[0].k==="p"?inSeason(a[0].p):0)<(b[0].k==="p"?inSeason(b[0].p):0)?1:-1));
 const ps=hits.filter(h=>h[0].k==="p").slice(0,12).map(h=>h[0].p),rs=hits.filter(h=>h[0].k==="d").slice(0,12).map(h=>h[0]);
 const pRow=p=>`<button class="sr" data-open="${p.id}"><img src="${IP}${p.id}.webp" alt="" loading="lazy"><span><b>${esc(p.name)}</b><small>${esc(p.local||p.sci)}</small></span>${inSeason(p)&&inRegion(p)?`<em class="sr-tag">In season</em>`:inRegion(p)?"":`<em class="sr-tag off">Not in your area</em>`}</button>`;
 const dRow=x=>{const im=dishImg(x.r)||{src:""};return `<button class="sr" data-dish="${x.i}"><img src="${im.src}" alt="" loading="lazy"${im.fb?` data-fb="${im.fb}" onerror="this.onerror=null;this.src=this.dataset.fb"`:""}><span><b>${esc(x.r.n)}</b><small>${esc(COURSES.find(c=>c[0]===x.r.c)[1])}</small></span>${rUntil(x.r)===0?`<em class="sr-tag">In season</em>`:""}</button>`};
 box.innerHTML=(ps.length?`<h3 class="sres-h">Wild foods</h3>${ps.map(pRow).join("")}`:"")+(rs.length?`<h3 class="sres-h">Recipes</h3>${rs.map(dRow).join("")}`:"")+(ps.length||rs.length?"":`<p class="sres-hint">No matches in ${esc(C.the||C.name)}.</p>`)+`<div id="sres-other"></div>`;
 const tok=raw;if(ps.length+rs.length<3)otherCountries(q,qw).then(o=>{if($("#sq").value!==tok||!o.length)return;const el=$("#sres-other");if(!el)return;
  el.innerHTML=`<h3 class="sres-h">Found in other countries</h3>`+o.map(([c,n,f,k,fi])=>`<a class="sr" href="../${c}/#${fi[0]}/${encodeURIComponent(fi[1])}"><span class="flag notr sr-flag">${f}</span><span><b>${esc(n)}</b><small>${k} match${k>1?"es":""}, e.g. ${esc(fi[2])}</small></span></a>`).join("")})}
