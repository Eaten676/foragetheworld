.sheet .hero{padding:0;max-width:none}
.vbox .vframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000;border-radius:10px}
.dimg.ing::after{display:none}
.btn.share svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;margin-right:6px;vertical-align:-3px}

.noimg{display:grid;place-items:center;width:100%;height:100%;font-family:var(--display);font-size:3rem;font-weight:700;color:var(--green);background:var(--green-soft)}
.favtag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.62);color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px}
.dcard b{display:block;font-family:var(--display);font-size:.98rem;line-height:1.2;margin-top:7px}
.dmeta{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}.dmeta.now{color:var(--green);font-weight:700}

footer{color:var(--muted);font-size:.85rem;padding-block:24px;border-top:1px solid var(--line)}

  if(was&&was!==v)window.scrollTo({top:0});
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+v?"page":"false"));
  if(deep){const id=decodeURIComponent(deep.slice(2));if(deep[0]==="p")openSheet(id);else{const i=R.findIndex(r=>dishSlug(r.n)===id);if(i>=0)openDish(i)}}
}
document.querySelector("a.brand").addEventListener("click",e=>{e.preventDefault();if(location.hash)history.pushState(null,"",location.pathname+location.search);route()});
addEventListener("popstate",route);
function renderTip(){$("#tip-root").innerHTML=TIP?fundHTML():""}
function renderFoot(){$("#foot").innerHTML=`Seasons and ranges are approximate and shift with weather and altitude. Identify every plant with an experienced local before eating it. Photos come from Wikimedia Commons under free licences, with credits under each one.<br><a href="${SITE}plants/">All wild plants</a> · <a href="${SITE}dishes/">All dishes</a> · <a href="${C.root}">Other countries</a>`}
document.title="Forage "+C.name;$("#cname").textContent=C.name;$("#brand").setAttribute("aria-label","Forage "+C.name+" home");
function renderAll(){renderFoot();renderTip();renderHome();renderNear();renderNutrition();renderMenu();renderSafety();route()}

const ss=$("#state");Object.keys(STATES).forEach(s=>ss.add(new Option(s,s,false,s===state.st)));
const ms=$("#month");MONTHS.forEach((m,i)=>ms.add(new Option(m,i+1,false,i+1===state.m)));
ss.onchange=e=>{state.st=e.target.value;store.set("fi-state-"+C.code,state.st);renderAll()};
ms.onchange=e=>{state.m=+e.target.value;renderAll()};
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-gsrc]");if(g){const h=document.getElementById("heroimg");if(h){h.src=g.dataset.gsrc;document.getElementById("herocap").innerHTML=g.dataset.gcap;document.querySelectorAll(".tb").forEach(t=>t.classList.toggle("on",t===g))}return}
  if(e.target.id==="copyupi"){const t=TIP.upiId;const done=()=>{e.target.textContent="Copied"};navigator.clipboard?.writeText(t).then(done,()=>{const r=document.createRange();r.selectNodeContents($("#upi"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r)});return}
  const o=e.target.closest("[data-open]");if(o){openSheet(o.dataset.open);return}
  const t=e.target.closest("[data-type]");if(t){state.type=t.dataset.type;renderNearList();return}
  const m=e.target.closest("[data-mode]");if(m){state.mode=m.dataset.mode;renderNearList();return}
  const dc=e.target.closest("[data-dish]");if(dc){openDish(+dc.dataset.dish);return}
  const mo=e.target.closest("[data-more]");if(mo){state.open=state.open||{};const k=mo.dataset.more;state.open[k]=!state.open[k];renderMenu();document.getElementById("course-"+k).scrollIntoView({block:"start"});return}
  const mm=e.target.closest("[data-menu]");if(mm){state.menu=mm.dataset.menu;renderMenu();return}
  const jp=e.target.closest("[data-jump]");if(jp){e.preventDefault();document.getElementById("course-"+jp.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start"});return}
  const n=e.target.closest("[data-nutr]");if(n){state.nutr=n.dataset.nutr;renderNutrition()}
});
addEventListener("hashchange",route);
renderAll();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}))}</script>
