 "methods": ["dry"], "warn": "Only use ripe, dry, mould-free pods; mouldy pods can carry toxins. Picking is fine, but don't spread the seeds.", "level": "beginner"}, {"id": "arak", "name": "Arak berries", "sci": "Salvadora persica", "local": "Arak · Kabath · Toothbrush tree", "type": "fruit", "regions": ["DS", "CO", "UR"], "months": [4, 5, 6], "nutr": ["vitC"], "note": "Sprawling shrub of sand plains and coasts with pale, fleshy leaves; its twigs are the miswak toothbrush. Clusters of small berries ripen red to purple.", "eat": "Ripe berries eaten fresh: sweet with a peppery bite.", "store": "Best fresh.", "methods": [], "warn": "Eat only small amounts.", "level": "beginner"}, {"id": "tropicalalmond", "name": "Tropical almond", "sci": "Terminalia catappa", "local": "Beydam · Indian almond", "type": "nut", "regions": ["UR", "EC", "CO"], "months": [5, 6, 7, 8, 9, 10, 11], "nutr": ["fat", "protein", "energy"], "note": "Big shade tree of streets, parks and the east coast with huge leaves that turn red before falling and almond-shaped fruits that ripen from green to red-purple.", "eat": "Crack the hard shell for the almond-like kernel, raw or toasted.", "store": "Dry the kernels.", "methods": ["nuts"], "level": "beginner"}, {"id": "mulberryae", "name": "Mulberries", "sci": "Morus alba", "local": "Toot", "type": "fruit", "regions": ["UR", "MT"], "months": [3, 4, 5], "nutr": ["vitC", "iron"], "note": "Spreading tree of farms, gardens and mountain villages with glossy, toothed leaves; berries ripen white, pink or purple in spring.", "eat": "Fresh, juice and jam.", "store": "Freeze or make jam.", "methods": ["jam", "freeze"], "level": "beginner"}], "R": [{"c": "drink", "n": "Mulberry juice", "u": ["mulberryae"], "d": "Ripe mulberries blended with water and a little sugar, served cold.", "yt": "mulberry juice recipe", "h": []}, {"c": "drink", "n": "Moringa leaf tea", "u": ["moringa"], "d": "Dried drumstick leaves steeped in hot water.", "yt": "moringa leaf tea", "h": []}, {"c": "starter", "n": "Grilled desert truffles", "u": ["truffle"], "d": "Peeled faqa' sliced, brushed with olive oil and grilled, finished with salt and coriander.", "yt": "desert truffle recipe", "h": ["DS"]}, {"c": "starter", "n": "Hummaid salad", "u": ["hummaid"], "d": "Sour bladder dock leaves with tomato, onion and lemon.", "yt": "rumex vesicarius salad", "h": ["MT"]}, {"c": "starter", "n": "Purslane fattoush", "u": ["purslane"], "d": "Toasted bread, purslane, tomato, cucumber and sumac dressing.", "yt": "purslane fattoush", "h": ["UR"]}, {"c": "side", "n": "Pickled capers", "u": ["caper"], "d": "Caper buds salted, then kept in vinegar brine.", "yt": "how to pickle capers", "h": ["MT"]}, {"c": "side", "n": "Date syrup (dibs)", "u": ["date"], "d": "Dates simmered, pressed and reduced to a dark syrup.", "yt": "date syrup dibs", "h": []}, {"c": "side", "n": "Ghaf leaf salad", "u": ["ghaf"], "d": "Finely minced young ghaf leaves mixed with fish and rice.", "yt": "ghaf tree leaves", "h": ["DS"]}, {"c": "main", "n": "Truffle saloona", "u": ["truffle"], "d": "Emirati tomato-based meat stew with chunks of desert truffle.", "yt": "saloona recipe", "h": ["DS"]}, {"c": "main", "n": "Khubbeiza (mallow stew)", "u": ["mallowae"], "d": "Mallow leaves sautéed with onion, garlic, olive oil and lemon.", "yt": "khubeiza recipe", "h": []}, {"c": "main", "n": "Wild greens with eggs", "u": ["amaranthae", "sowthistle", "goosefoot"], "d": "Wilted wild greens cooked with onion and spices, then eggs scrambled in.", "yt": "wild greens eggs recipe", "h": []}, {"c": "bread", "n": "Mesquite flour flatbread", "u": ["mesquiteae"], "d": "Part mesquite flour, part wheat flour, cooked on a hot griddle.", "yt": "mesquite flour recipe", "h": []}, {"c": "dessert", "n": "Luqaimat with date syrup", "u": ["date"], "d": "Crisp fried dough balls drizzled with dibs.", "yt": "luqaimat recipe", "h": []}, {"c": "dessert", "n": "Fresh rutab", "u": ["date"], "d": "Soft, half-ripe summer dates eaten straight from the bunch with Arabic coffee.", "yt": "rutab dates", "h": []}, {"c": "dessert", "n": "Sidr fruit snack", "u": ["sidr"], "d": "Ripe nabq eaten fresh or sun-dried.", "yt": "sidr fruit nabq", "h": []}], "YT": {"sidr": "sidr fruit uae", "date": "dates uae", "ghaf": "ghaf leaves and pods uae", "truffle": "desert truffle uae", "hummaid": "bladder dock uae", "arta": "arta fruit uae", "purslane": "purslane uae", "moringa": "wild drumstick tree uae", "caper": "capers uae", "mallowae": "mallow uae", "goosefoot": "nettle-leaved goosefoot uae", "amaranthae": "green amaranth uae", "sowthistle": "sow thistle uae", "mesquiteae": "mesquite pods uae", "arak": "arak berries uae", "tropicalalmond": "tropical almond uae", "mulberryae": "mulberries uae"}, "YT_M": {}, "HARVEST_T": {"green": "Pick a few young leaves by hand, only from plants on farms, in gardens or on land where you have permission. Federal law protects wild plants, so never uproot anything.", "fruit": "Pick only ripe fruit that comes away easily, and only with the owner's permission: most trees and palms belong to a farm, a family or the municipality.", "root": "Only dig roots where you have the landowner's permission, since uprooting wild plants is illegal in many places. Take a few from a large patch and backfill the hole.", "starch": "Tap or collect only from healthy, mature trees, and only in the short season the sap runs. Remove taps afterwards so the tree can heal.", "nut": "Gather nuts from the ground once they fall, discarding any with holes or mould. Leave plenty for wildlife, which depends on them for winter.", "flower": "Pick flowers on a dry, sunny morning once the dew has gone, when the scent is strongest. Take a few heads from each plant so it can still set fruit.", "grain": "Shake or strip ripe seed heads into a bag when they rattle and fall easily. Winnow out the chaff in a breeze.", "fungi": "Twist or cut mushrooms at the base, brush off soil in the woods and carry them in a basket, never a plastic bag. Only take ones you're 100% sure of, leave old and very young ones, and follow local limits.", "protein": "Check local rules, licences, size limits and water-quality warnings before taking any shellfish or fish."}, "HARVEST": {}, "METHODS": [{"id": "dry", "name": "Dry herbs and greens", "keeps": "Keeps 6–12 months", "steps": ["Shake off insects and dirt; wash only if needed and dry well.", "Hang in small bunches or spread thinly on a screen in a warm, airy place out of direct sun.", "When leaves crumble, strip them from the stems.", "Store in airtight jars in the dark."]}, {"id": "freeze", "name": "Blanch and freeze", "keeps": "Keeps 8–12 months", "steps": ["Wash and trim.", "Plunge into boiling water for 1–2 minutes, then into ice water.", "Squeeze or drain dry and pack into portions.", "Freeze flat in bags so they thaw fast."]}, {"id": "jam", "name": "Jam, jelly and fruit cheese", "keeps": "Keeps a year unopened", "steps": ["Simmer fruit with a little water until soft; strain through a cloth for jelly.", "Add sugar (about equal weight for jam) and boil hard to setting point.", "Pour into hot sterilised jars and seal.", "Crab apples add pectin to low-pectin berries."]}, {"id": "cordial", "name": "Cordials and syrups", "keeps": "Keeps 2–3 months in the fridge; a year frozen", "steps": ["Steep flowers in cold water overnight, or simmer berries and strain.", "Dissolve sugar into the liquid with lemon or citric acid.", "Bottle hot into sterilised bottles.", "Dilute about 1 to 10 with water or sparkling water."]}, {"id": "infuse", "name": "Infused vinegar, oil and pesto", "keeps": "Vinegar keeps a year; pesto 3 months frozen", "steps": ["Pack fresh herbs or flowers loosely into a jar.", "Cover with vinegar and leave 2–4 weeks in the dark, then strain.", "For pesto, blend leaves with oil, nuts and salt and freeze in ice-cube trays.", "Never store fresh garlic or herbs in oil at room temperature."]}, {"id": "pickle", "name": "Pickle and ferment", "keeps": "Keeps 6–12 months", "steps": ["Pack shoots, buds or roots tightly into a clean jar.", "Cover with hot spiced vinegar brine, or with 2% salt brine to ferment.", "Keep vegetables under the liquid with a weight.", "Ferments are ready in 1–3 weeks; move to the fridge."]}, {"id": "nuts", "name": "Cure and store nuts", "keeps": "Keeps 6–12 months", "steps": ["Remove husks; float nuts in water and discard any that float.", "Dry in the shell in a single layer in an airy, rodent-proof place for 2–4 weeks.", "Store cool and dry; shell as needed.", "Freeze shelled nuts to stop them going rancid."]}, {"id": "leach", "name": "Leach acorns", "keeps": "Flour keeps 6 months frozen", "steps": ["Shell and chop or grind acorns.", "Soak in cold water, changing it daily, until the bitterness is gone (several days), or boil in changes of water.", "Dry the meal at low heat.", "Grind to flour for breads and pancakes."]}, {"id": "roots", "name": "Store roots", "keeps": "Keeps 2–4 months", "steps": ["Don't wash; brush off soil and let skins dry.", "Pack in damp sand or sawdust in a box.", "Keep cold and dark, just above freezing.", "Check monthly and remove any soft ones."]}, {"id": "detox", "name": "Make it safe to eat", "keeps": "Do this every time", "steps": ["Nettles: cooking, blanching or drying removes the sting.", "Fiddleheads: boil 15 minutes and discard the water before eating.", "Elderberries: always cook them; raw berries, leaves and stems cause sickness.", "Acorns: leach out the tannins before eating."]}], "DANGER": [["Sodom's apple", "Calotropis procera · Ushar", "Grey-green shrub with big rubbery leaves and balloon-like fruits. The milky sap can blind you and the whole plant is poisonous."], ["Colocynth", "Citrullus colocynthis · Hanzal", "Creeping vine with small, round, striped melons on the sand. Extremely bitter and a violent purgative that can kill."], ["Oleander", "Nerium oleander", "Garden and wadi shrub with pink or white flowers and long pods. Every part stops the heart."], ["Thorn apple", "Datura species", "Big white trumpet flowers and spiny seed pods on waste ground. Deadly."], ["Isbaq", "Euphorbia larica", "Leafless, grey-green mountain shrub whose milky sap burns skin and eyes."], ["Harmal", "Rhazya stricta", "Upright, glossy-leaved shrub of gravel plains and wadis that even camels avoid. Poisonous."]], "LOOK": [{"p": ["purslane"], "tw": "euphorbia", "name": "Prostrate spurge", "sci": "Euphorbia prostrata and relatives", "local": "Spurge", "sev": "Harmful", "tells": ["Purslane has thick, fleshy leaves and clear, watery sap.", "Spurges are thin and flat with tiny leaves, and bleed white milky sap that burns skin and eyes."]}], "COURSES": [["drink", "Drinks"], ["starter", "Starters & snacks"], ["side", "Sauces, preserves & sides"], ["main", "Main course"], ["bread", "Breads & baking"], ["dessert", "Desserts"]], "TIP": null, "rules": [["100% sure or don't eat it.", "Check the leaf, stem, flower, smell and root. If one feature is off, leave it."], ["Learn from an expert.", "Join a guided foraging walk; local foragers know the lookalikes."], ["Try one new food at a time,", "a small cooked portion, then wait a day."], ["Avoid pollution:", "busy roads, sprayed verges and parks, industrial land, dog-walking paths, polluted water."], ["Beat the heat.", "Forage in the cool months and early mornings, carry plenty of water, and never go into wadis when rain is forecast: flash floods are deadly."], ["Ask first.", "Nearly all palms, fruit trees and farms are private. Ask the owner, and stay out of fenced reserves."]], "CREDITS": {"sidr": {"a": "Ariel Palmon", "l": "CC BY-SA 3.0", "s": "https://commons.wikimedia.org/wiki/File:Ziziphus_spina-christi_3.jpg"}, "date": {"a": "Vicharam", "l": "CC BY 3.0", "s": "https://commons.wikimedia.org/wiki/File:Palm_dates_bunch.JPG"}, "ghaf": {"a": "LRBurdak", "l": "CC BY-SA 4.0", "s": "https://commons.wikimedia.org/wiki/File:Prosopis_cineraria_-_Khejri.jpg"}, "truffle": {"a": "محمد الفهيد", "l": "CC BY 3.0", "s": "http const LGX=C.lang&&I18N[C.lang]?C.lang:null;
let LG=(()=>{if(!LGX)return "en";const s=store.get("fi-lang");if(s)return s;return (navigator.language||"").toLowerCase().startsWith(LGX==="nb"?"n":LGX)?LGX:"en"})();
const EN_M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const trS=t=>{const D=I18N[LG];if(!D)return t;if(D[t]!=null&&typeof D[t]==="string")return D[t];
  const cn=x=>D._c[x]||x;const mm=x=>x.replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g,m=>D._m[EN_M.indexOf(m)]);
  for(const [re,rep] of D._p){if(re.test(t)){return mm(t.replace(re,rep).replace(/\$C/g,"")).replace(new RegExp(Object.keys(D._c).join("|")||"^$"),cn)}}
  if(EN_M.includes(t))return D._m[EN_M.indexOf(t)];
  if(/(^| · |, )(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)(, (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec))*$/.test(t))return mm(t);
  return t};
let trBusy=false;
const trNode=root=>{if(LG==="en"||!root)return;trBusy=true;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode;return p&&(p.closest&&p.closest("script,style,.notr"))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
  let n;while(n=w.nextNode()){const v=n.nodeValue,t=v.trim();if(!t||!/[A-Za-z]/.test(t))continue;const r=trS(t);if(r!==t)n.nodeValue=v.replace(t,r)}
  if(root.querySelectorAll)root.querySelectorAll("[placeholder],[aria-label],[title]").forEach(e=>{for(const a of ["placeholder","aria-label","title"]){const v=e.getAttribute(a);if(v){const r=trS(v);if(r!==v)e.setAttribute(a,r)}}});
  trBusy=false};
if(LGX){new MutationObserver(ms=>{if(trBusy)return;for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===1)trNode(n);else if(n.nodeType===3&&n.parentNode)trNode(n.parentNode)}}).observe(document.body,{childList:true,subtree:true});
  document.documentElement.lang=LG==="en"?"en":LG;
  const lb=document.createElement("button");lb.className="langbtn notr";lb.type="button";lb.textContent=LG==="en"?(LGX==="nb"?"NO":LGX.toUpperCase()):"EN";lb.title=LG==="en"?I18N[LGX]._n:"English";lb.setAttribute("aria-label","Language");

document.addEventListener("click",e=>{

  const m=e.target.closest("[data-mode]");if(m){state.mode=m.dataset.mode;renderNearList();return}
  const dc=e.target.closest("[data-dish]");if(dc){openDish(+dc.dataset.dish);return}
