ee can heal.", "nut": "Gather nuts from the ground once they fall, discarding any with holes or mould. Leave plenty for wildlife, which depends on them for winter.", "flower": "Pick flowers on a dry, sunny morning once the dew has gone, when the scent is strongest. Take a few heads from each plant so it can still set fruit.", "grain": "Shake or strip ripe seed heads into a bag when they rattle and fall easily. Winnow out the chaff in a breeze.", "fungi": "Twist or cut mushrooms at the base, brush off soil in the woods and carry them in a basket, never a plastic bag. Only take ones you're 100% sure of, leave old and very young ones, and follow local limits.", "protein": "Check local rules, licences, size limits and water-quality warnings before taking any shellfish or fish."}, "HARVEST": {"nettle": "Wear gloves and snip the top four leaves of plants that haven't flowered.", "dandelion": "Pick young leaves from plants not yet in flower; flowers on a sunny morning when fully open; dig roots in autumn with permission.", "chickweed": "Snip the soft top few centimetres with scissors, leaving the roots so it regrows within weeks.", "woodsorrel": "Pinch off a few leaves and flowers from large patches; never pull up the creeping roots.", "garlicmustard": "Pick young leaves in spring and the tender flowering tops; pulling whole plants is fine where it is invasive.", "lambsquarters": "Pick the top 10–15 cm of young plants; strip seeds in autumn by running a hand up the dry spikes.", "plantain": "Pick young, soft leaves from the centre of the rosette, and green flower buds before they open.", "watercress": "Cut stems above the water line with scissors, only from clean, flowing water away from livestock.", "hops": "Snap off the top 10–15 cm of new shoots where they bend easily, like asparagus.", "spruce": "Pick the bright new tips once the brown papery caps fall off, a few from each branch, spread across many trees.", "blackberry": "Pick glossy, fully black berries that come away easily; wear long sleeves and avoid low berries by dog-walking paths.", "raspberry": "Pick berries that slip off their core with no tug, into a shallow container.", "lingonberry": "Pick ripe red clusters from late August; berries keep well because they are naturally preserved.", "cloudberry": "Pick when amber and soft, with the green husk easily separated; check whether picking is restricted on that land.", "strawberry": "Pick the tiny berries when fully red and soft; leave plants and runners undisturbed.", "elderberry": "Cut whole drooping clusters when every berry is dark purple; strip off stalks with a fork before cooking.", "elderflower": "Cut fully open, creamy flower heads on a sunny morning; smell them and use the same day. Leave plenty for berries.", "rosehip": "Pick firm, bright red hips after a frost, from many bushes; leave plenty for birds.", "rowan": "Cut whole clusters when bright orange-red; freezing them overnight reduces the bitterness.", "hawthorn": "Strip dark red haws in autumn; young leaves can be picked in spring.", "crabapple": "Collect fallen or easily picked apples in autumn; slightly underripe ones have the most pectin.", "seabuckthorn": "Cut whole small branches with secateurs where allowed, freeze them, then shake or knock off the berries.", "cranberry": "Pick red berries from the bog surface in autumn; stay on boardwalks where they exist.", "crowberry": "Strip the black berries from the mats with a berry comb or by hand.", "gooseberry": "Pick when berries soften and colour; wear gloves against the spines.", "juniper": "Pick only the blue-black, ripe berries (two years old), leaving green ones to ripen.", "hazelnut": "Pick nuts as husks turn brown and the nut slips out, before squirrels get them; or gather fallen nuts.", "chestnut": "Gather fallen nuts with gloves or by rolling the spiny cases open with your boots; choose plump, shiny nuts.", "beechnut": "Gather fallen nuts in mast years; most husks are empty, so test a few first.", "linden": "Pick flower clusters with their leafy bract when the scent is strongest, early in flowering.", "yarrow": "Snip young leaves in spring and flower heads in summer.", "redclover": "Pick fresh pink heads in full bloom, avoiding brown ones.", "burdock": "Dig first-year roots in autumn or early spring with the landowner's permission; they can be long, so use a narrow spade.", "dulse": "Cut fronds with scissors at low tide, leaving the base attached so it regrows.", "kelp": "Cut the blade above the stipe at spring low tides, never pulling up the holdfast.", "laver": "Peel sheets off rocks at low tide, taking a little from many rocks.", "mussel": "Twist mussels off rocks at low tide, taking only large ones, and check local toxin warnings first.", "chanterelle": "Cut or twist at the base, brush off soil and needles on the spot, and leave small ones to grow.", "porcini": "Twist out firm, young specimens; slice in half on the spot to check for maggots.", "puffball": "Cut only young, pure-white, firm puffballs; slice each in half to check it's white all through.", "chickenwoods": "Cut the soft outer edges of young brackets with a knife, leaving the tough base on the tree.", "hedgehog": "Cut at the base and brush off the spines' debris; leave small ones to spread spores.", "ramps": "Cut a single leaf per plant with scissors and leave the bulb in the ground. Only pick from large, healthy patches.", "fiddlehead": "Snap off two or three tight coils per crown, leaving at least half so the fern survives.", "maple": "Drill a 5/16-inch hole 5 cm deep on the sunny side, tap in a spile and hang a clean bucket. Collect daily and keep the sap cold.", "birchsap": "Drill a small hole a few centimetres deep, collect for a few days only, then plug the hole with a twig.", "acorn": "Gather fallen acorns without holes. Float them and discard floaters.", "pawpaw": "Shake the trunk gently: ripe pawpaws drop, or pick fruit that is soft and fragrant.", "cattail": "Pull young inner shoots in spring; green flower spikes in early summer; yellow pollen by shaking heads into a bag.", "sumac": "Cut whole red clusters on a dry day before rain washes off the sour coating.", "wildrice": "Harvesting needs a licence; ricers bend stalks over a canoe and knock ripe grains loose with sticks.", "camas": "Mark plants while in flower so you dig only blue-flowered camas later; take a few bulbs and replant the small ones.", "carrageen": "Cut fronds at spring low tides, leaving the base, and bleach them by rinsing in rain and sun.", "periwinkle": "Pick winkles from rocks at low tide, leaving the small ones.", "cleavers": "Pick the soft tops in early spring before they get bristly.", "sealettuce": "Pick fresh green sheets in rock pools, leaving the holdfast.", "icelandmoss": "Gather small amounts by hand from clean upland areas, leaving most of the patch.", "rugosa": "Pick firm red hips in late summer; wear gloves against the prickles."}, "METHODS": [{"id": "dry", "name": "Dry herbs and greens", "keeps": "Keeps 6–12 months", "steps": ["Shake off insects and dirt; wash only if needed and dry well.", "Hang in small bunches or spread thinly on a screen in a warm, airy place out of direct sun.", "When leaves crumble, strip them from the stems.", "Store in airtight jars in the dark."]}, {"id": "freeze", "name": "Blanch and freeze", "keeps": "Keeps 8–12 months", "steps": ["Wash and trim.", "Plunge into boiling water for 1–2 minutes, then into ice water.", "Squeeze or drain dry and pack into portions.", "Freeze flat in bags so they thaw fast."]}, {"id": "jam", "name": "Jam, jelly and fruit cheese", "keeps": "Keeps a year unopened", "steps": ["Simmer fruit with a little water until soft; strain through a cloth for jelly.", "Add sugar (about equal weight for jam) and boil hard to setting point.", "Pour into hot sterilised jars and seal.", "Crab apples add pectin to low-pectin berries."]}, {"id": "cordial", "name": "Cordials and syrups", "keeps": "Keeps 2–3 months in the fridge; a year frozen", "steps": ["Steep flowers in cold water overnight, or simmer berries and strain.", "Dissolve sugar into the liquid with lemon or citric acid.", "Bottle hot into sterilised bottles.", "Dilute about 1 to 10 with water or sparkling water."]}, {"id": "infuse", "name": "Infused vinegar, oil and pesto", "keeps": "Vinegar keeps a year; pesto 3 months frozen", "steps": ["Pack fresh herbs or flowers loosely into a jar.", "Cover with vinegar and leave 2–4 weeks in the dark, then strain.", "For pesto, blend leaves with oil, nuts and salt and freeze in ice-cube trays.", "Never store fresh garlic or herbs in oil at room temperature."]}, {"id": "pickle", "name": "Pickle and ferment", "keeps": "Keeps 6–12 months", "steps": ["Pack shoots, buds or roots tightly into a clean jar.", "Cover with hot spiced vinegar brine, or with 2% salt brine to ferment.", "Keep vegetables under the liquid with a weight.", "Ferments are ready in 1–3 weeks; move to the fridge."]}, {"id": "nuts", "name": "Cure and store nuts", "keeps": "Keeps 6–12 months", "steps": ["Remove husks; float nuts in water and discard any that float.", "Dry in the shell in a single layer in an airy, rodent-proof place for 2–4 weeks.", "Store cool and dry; shell as needed.", "Freeze shelled nuts to stop them going rancid."]}, {"id": "leach", "name": "Leach acorns", "keeps": "Flour keeps 6 months frozen", "steps": ["Shell and chop or grind acorns.", "Soak in cold water, changing it daily, until the bitterness is gone (several days), or boil in changes of water.", "Dry the meal at low heat.", "Grind to flour for breads and pancakes."]}, {"id": "roots", "name": "Store roots", "keeps": "Keeps 2–4 months", "steps": ["Don't wash; brush off soil and let skins dry.", "Pack in damp sand or sawdust in a box.", "Keep cold and dark, just above freezing.", "Check monthly and remove any soft ones."]}, {"id": "detox", "name": "Make it safe to eat", "keeps": "Do this every time", "steps": ["Nettles: cooking, blanching or drying removes the sting.", "Fiddleheads: boil 15 minutes and discard the water before eating.", "Elderberries: always cook them; raw berries, leaves and stems cause sickness.", "Acorns: leach out the tannins before eating."]}], "DANGER": [["Water hemlock", "Cicuta maculata", "White umbrella flowers by water. The most poisonous plant in North America; a bite of root can kill."], ["Poison hemlock", "Conium maculatum", "Tall, purple-blotched, hollow stems and lacy leaves along roads and ditches. Deadly."], ["Death camas", "Toxicoscordion", "Grassy-leaved meadow lily with creamy flowers, growing with wild onions and camas. Deadly."], ["Pokeweed", "Phytolacca americana", "Magenta stems and strings of purple berries. Roots, berries and mature leaves are poisonous."], ["Jimsonweed", "Datura stramonium", "Trumpet flowers and spiny seed pods on disturbed ground. Causes delirium and death."], ["Yew", "Taxus", "Evergreen with flat soft needles and red cup berries. The seed and foliage are deadly."], ["Moonseed", "Menispermum canadense", "Grape-like vine with one crescent seed per berry. Deadly."], ["Other wild mushrooms", "Amanita and others", "Death caps and destroying angels kill. Only eat the mushrooms in this guide, start with the five beginner ones, and only when 100% sure."], ["Giant hogweed", "Heracleum mantegazzianum", "Huge umbels over 2 m tall. The sap burns skin badly in sunlight."]], "LOOK": [{"p": ["morel"], "tw": "gyromitra", "name": "False morel", "sci": "Gyromitra esculenta", "local": "False morel · Beefsteak mushroom", "sev": "Deadly", "tells": ["Slice it in half from top to bottom: a true morel is one continuous hollow chamber.", "False morels are wrinkled and brain-like rather than pitted, and are stuffed with cottony fibres.", "Morel caps attach directly to the stem; half-free morels hang like a skirt but are still hollow."]}, {"p": ["oystermush"], "tw": "pleurocybella", "name": "Angel wings", "sci": "Pleurocybella porrigens", "local": "Angel wings", "sev": "Poisonous", "tells": ["Angel wings are thin, pure white and grow on conifer wood.", "Oyster mushrooms are thicker and fleshier, usually grey-brown to cream, on hardwoods, and smell of anise."]}, {"p": ["shaggymane"], "tw": "coprinopsis", "name": "Common ink cap", "sci": "Coprinopsis atramentaria", "local": "Tippler's bane", "sev": "Harmful", "tells": ["Shaggy mane is tall, white and covered in shaggy scales.", "The ink cap is smaller, smooth and grey-brown, in clusters.", "Ink cap with alcohol, even days later, causes violent sickness."]}, {"p": ["balsamfir", "juniper", "whitepine"], "tw": "taxus", "name": "Yew", "sci": "Taxus canadensis / T. brevifolia", "local": "Canada yew · Pacific yew", "sev": "Deadly", "tells": ["Yew needles are flat and green on both sides with no white stripes and no resin smell.", "Yew has red, cup-shaped berries, not cones.", "Fir smells of resin; juniper berries are blue and dusty."]}, {"p": ["elderflower", "elderberry"], "tw": "conium", "name": "Poison hemlock", "sci": "Conium maculatum", "local": "Poison hemlock", "sev": "Deadly", "tells": ["Elder is a woody shrub. Poison hemlock is a soft, hollow-stemmed plant.", "Hemlock stems are smooth with purple blotches.", "Crushed hemlock smells mousy and unpleasant."]}, {"p": ["camas", "noddingonion", "wildchives"], "tw": "toxicoscordion", "name": "Death camas", "sci": "Toxicoscordion venenosum", "local": "Death camas", "sev": "Deadly", "tells": ["Camas has blue-violet star flowers. Death camas has creamy-white flowers in a tighter cluster.", "The bulbs and leaves look alike out of flower, so only dig plants marked while flowering."]}, {"p": ["wildonion", "fieldgarlic", "ramps"], "tw": "convallaria", "name": "Lily of the valley", "sci": "Convallaria majalis", "local": "Lily of the valley", "sev": "Deadly", "tells": ["Ramps and wild onions smell of onion or garlic. Lily of the valley smells of nothing when crushed.", "Lily of the valley has nodding white bell flowers in a row."]}, {"p": ["ramps", "solomonseal"], "tw": "veratrum", "name": "False hellebore", "sci": "Veratrum viride", "local": "False hellebore · Corn lily", "sev": "Deadly", "tells": ["False hellebore leaves are deeply pleated along their length.", "It grows from a tall stalk with many leaves; ramps have 2–3 leaves from the base, and Solomon's seal shoots have smooth, unpleated leaves on an arching stem.", "No onion smell."]}, {"p": ["wildgrape"], "tw": "menispermum", "name": "Moonseed", "sci": "Menispermum canadense", "local": "Canada moonseed", "sev": "Deadly", "tells": ["Grape has forked tendrils; moonseed has none.", "Grape berries have 2–4 teardrop seeds; moonseed has a single crescent-moon seed.", "Moonseed leaves join the stalk slightly inside the edge."]}, {"p": ["cattail"], "tw": "iris", "name": "Yellow flag iris", "sci": "Iris pseudacorus", "local": "Yellow flag iris", "sev": "Harmful", "tells": ["Cattail leaves are D-shaped in section and spongy; iris leaves are flat and sharp-edged in a fan.", "Iris has yellow flowers; cattail has a brown sausage head."]}, {"p": ["elderberry"], "tw": "phytolacca", "name": "Pokeweed berries", "sci": "Phytolacca americana", "local": "Pokeweed", "sev": "Poisonous", "tells": ["Pokeberries hang in long drooping strings on magenta stems.", "Elderberries sit in flat-topped umbrellas on a woody shrub."]}, {"p": ["chickweed"], "tw": "anagallis", "name": "Scarlet pimpernel", "sci": "Lysimachia arvensis", "local": "Scarlet pimpernel", "sev": "Harmful", "tells": ["Chickweed has a single line of hairs down its stem and white flowers.", "Scarlet pimpernel has square stems, black dots under the leaves and orange flowers."]}, {"p": ["chanterelle"], "tw": "omphalotus", "name": "Jack-o'-lantern mushroom", "sci": "Omphalotus olearius", "sev": "Poisonous", "tells": ["Chanterelles grow singly from soil; jack-o'-lanterns grow in tight clusters from wood or buried roots.", "Jack-o'-lanterns have true, sharp-edged gills; chanterelles have blunt, forking ridges.", "Chanterelle flesh is white inside; jack-o'-lantern flesh is orange."], "local": "Jack-o'-lantern mushroom"}, {"p": ["porcini"], "tw": "rubroboletus", "name": "Devil's bolete", "sci": "Rubroboletus satanas", "sev": "Poisonous", "tells": ["Devil's bolete has red pores and a red-netted stem; porcini pores are white to yellow-green.", "Its flesh turns blue when cut; porcini flesh stays white."], "local": "Devil's bolete"}, {"p": ["puffball"], "tw": "amanita", "name": "Death cap (young 'egg')", "sci": "Amanita phalloides", "sev": "Deadly", "tells": ["Cut every puffball in half: a puffball is pure white and uniform inside.", "A young Amanita shows the outline of a cap, gills and stem inside the 'egg'.", "Death caps kill; there is no safe amount."], "local": "Death cap (young 'egg')"}, {"p": ["milkweed"], "tw": "apocynum", "name": "Dogbane", "sci": "Apocynum cannabinum / A. androsaemifolium", "local": "Indian hemp · Apocyn", "sev": "Poisonous", "tells": ["Milkweed shoots are fuzzy, thick and unbranched, with big soft leaves.", "Dogbane shoots are smooth, thin and often reddish, and branch as they grow; also milky sap. Never eat it."]}], "COURSES": [["drink", "Drinks"], ["starter", "Starters & snacks"], ["side", "Sauces, preserves & sides"], ["main", "Main course"], ["bread", "Breads & baking"], ["dessert", "Desserts"]], "TIP": null, "rules": [["100% sure or don't eat it.", "Check the leaf, stem, flower, smell and root. If one feature is off, leave it."], ["Learn from an expert.", "Join a guided foraging walk; local foragers know the lookalikes."], ["Try one new food at a time,", "a small cooked portion, then wait a day."], ["Avoid pollution:", "busy roads, sprayed verges and parks, industrial land, dog-walking paths, polluted water."], ["Parks:", "foraging is banned in most national parks except small amounts of berries and nuts for eating on the spot; provincial parks vary."], ["Crown land", "usually allows personal foraging; private land needs permission."], ["Respect Indigenous harvesting rights", "and stay off reserve land without permission."]], "CREDITS": {"gooseberry": {"a": "Krzysztof Ziarnek, Kenraiz", "l": "CC BY-SA 4.0", "s": "https://commons.wikimedia.org/wiki/File:Ribes_uva-crispa_kz04.jpg"}, "chokeberry": {"a": "manfred.sause@volloeko.de", "l": "CC BY-SA 3.0", "s": "https://commons.wikimedia.org/wiki/File:Aronia_melanocarpa_cv_Rubina_P1020524.JPG"}, "highbushcranberry": {"a": "Edward Tremel (Edward Tremel)", "l": "CC BY-SA 3.0", "s": "https://commons.wikimedia.org/wiki/File:Highbush_Cranberry.jpg"}, "salal": {"a": "Robert Flogaus-Faust", "l": "CC BY 4.0", "s": "https://commons.wikimedia.org/wiki/File:Gaultheria_shallon_RF.jpg"}, "groundcherry": {"a": "Matthieu Godbout", "l": "CC BY-SA 3.0", "s": "https://commons.wikimedia.org/wiki/File:Cerises_de_terre.jpg"}, "whiteclover": {"a": "Vinayaraj", "l": "CC BY-SA 4.0", "s": "https://commons.wikimedia.org/wiki/File:Trifolium_repens_-_white_clover_on_way_from_Govindghat_to_Gangria_at_Valley_of_Flowers_National_Park_-_during_LGFC_-_VOF_2019_(1).jpg"}, "fireweed": {"a": "kallerna", "l": "CC BY-SA 3.0", "s": "https://commons.wikimedia.org/wiki/File:Maitohorsma_(Epilobium_angustifolium).JPG"}, "fieldmustard": {"a": "TeunSpaans", "l": "CC BY-SA 3.0", "s": "https://commons.wikimedia.org/wiki/File:Brassica_rapa_plant.jpg"}, "bullkelp": {"a": "Chris Teague", "l": "CC BY 4.0", "s": "https://commons.wikimedia.org/wiki/File:Nereocystis_luetkeana1.jpg"}, "birchsap": {"a": "Percita at Flickr", "l": "CC BY-SA 2.0", "s": "https://commons.wikimedia.org/wiki/File:Betula_pendula_Finland.jpg"}, "chanterelle": {"a": "See source", "l": "CC BY-SA 3.0", "s": "https://commons.wikimedia.org/wiki/File:Chanterelle_Cantharellus_cibarius.jpg"}, "porcini": {"a": "ReddishClover", "l": "CC BY-SA 4.0", "s": "https://commons.wikimedia.org/wiki/File:Boletus_edulis_IT.jpg"}, "puffball": {"a": "The original uploader was Sulfur at English W…", "l": "CC BY-SA 3.0", "s": "https://commons.wikimedia.org/wiki/File:Giant_Puffball.jpg"}, "chickenwoods": {"a": "Rror", "l": "CC BY-SA 3.0", "s": "https://commons.wikimedia.org/wiki/File:Laetiporus_sulphureus_big.jpg"}, "hedgehog": {"a": "D J Kelly", "l": "Public domain", "s": "https://commons.wikimedia.org/wiki/File:Hedgehog_fungi2.jpg"}, "nettle": {"a": "Evelyn Simak", "l": "CC BY-SA 2.0", "s": "https://commons.wikimedia.org/wiki/File:Fen_nettle_(Urtica_dioica_ssp._galeopsifolia)_-_geograph.org.uk_-_5423125.jpg"}, "dandelion": {"a": "Mathieu Kappler", "l": "CC BY-SA 4.0", "s": "https://commons.wikimedia.org/wiki/File:Taraxacum_officinale_in_Remiremont,_France_-_2022-05-03_-_02.jpg"}, "chickweed": {"a": "Kaldari", "l": "CC0", "s": "https://commons.wikimedia.org/wiki/File:Kaldari_Stellaria_media_01.jpg"}, "lambsquarters": {"a": "Rasbak", "l": "CC BY-SA 3.0", "s": "https://commons.wikimedia.org/wiki/File:Melganzenvoet_bloeiwijze_Chenopodium_album.jpg"}, "purslane": {"a": "(c) Tyler Ekholm, some rights reserved (CC BY)", "l": "CC BY 4.0", "s": "https://commons.wikimedia.org/wiki/File:Common_Purslane,_United_States_imported_from_iNaturalist_photo_541953905.jpg"}, "woodsorrel": {"a": "6th Happiness", "l": "CC BY-SA 3.0", "s": "https://commons.wikimedia.org/wiki/File:6h_common_yellow_oxalis.jpg"}, "garlicmustard": {"a": "O. Pichard", "l": "CC BY-SA 3.0", "s": "https://commons.wikimedia.org/wiki/File:Alliaria_petiolata_marais-belloy-sur-somme_80_26042007_3.jpg"}, "ramps": {"a": "Hardyplants at English Wikipedia", "l": "Public domain", "s": "https://commons.wikimedia.org/wiki/File:Wild_Leeks6.jpeg"}, "wildonion": {"a": "Eric Hunt", "l": "CC BY-SA 4.0", "s": "https://commons.wikimedia.org/wiki/File:Allium_canadense_var_canadense.jpg"}, "plantain": {"a": "Rasbak", "l": "CC BY-SA 3.0", "s": "https://commons.wikimedia.org/wiki/File:Grote_weegbree_bloeiwijze_Plantago_major_subsp._major.jpg"}, "violet": {"a": "James Steakley", "l": "CC BY-SA 3.0", "s": "https://commons.wikimedia.org/wiki/File:Viola_sororia_in_Wisconsin.jpg"}, "fiddlehead": {"a": "Ɱ", "l": "CC BY-SA const nrm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
const lev=(a,b,max)=>{if(Math.abs(a.length-b.length)>max)return max+1;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const c=[i];let best=i;for(let j=1;j<=b.length;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));if(c[j]<best)best=c[j]}if(best>max)return max+1;p=c}return p[b.length]};
const SIDX=(()=>{const byId=Object.fromEntries(P.map(p=>[p.id,p]));
 const pl=P.map(p=>({k:"p",p,f:[[nrm(p.name),10],[nrm(p.local),6],[nrm(p.sci),5],[nrm(TYPES[p.type]||p.type),2]]}));
 const ds=R.map((r,i)=>({k:"d",r,i,f:[[nrm(r.n),10],[nrm((r.u||[]).map(u=>byId[u]?byId[u].name+" "+byId[u].local:u).join(" ")),5],[nrm(r.d),2]]}));
 return pl.concat(ds)})();
function sScore(it,q,qw){let s=0;for(const [f,w] of it.f){if(!f)continue;if(f===q)s=Math.max(s,w*12);else if(f.startsWith(q))s=Math.max(s,w*10);else if((" "+f).includes(" "+q))s=Math.max(s,w*8);else if(f.includes(q))s=Math.max(s,w*5);
  else if(qw.every(x=>f.includes(x)))s=Math.max(s,w*4);
  else{const fw=f.split(" ");let ok=0;for(const x of qw){if(x.length<4)continue;const m=x.length>6?2:1;if(fw.some(y=>lev(x,y.slice(0,x.length+1),m)<=m||lev(x,y,m)<=m))ok++}if(ok&&ok===qw.filter(x=>x.length>=4).length)s=Math.max(s,w*2)}}
 return s}
let GIDX=null;
async function otherCountries(q,qw){try{if(!GIDX)GIDX=await fetch("../search-index.json").then(r=>r.json())}catch(e){return []}
 const out=[];for(const [c,v] of Object.entries(GIDX)){if(c===C.code)continue;let n=0,first=null;
  for(const [id,name,loc,sci] of v.p){const f=nrm(name+" "+loc+" "+sci);if(f.includes(q)||qw.every(x=>f.includes(x))){n++;first=first||["p",id,name]}}
  for(const [sl,name] of v.d){if(nrm(name).includes(q)){n++;first=first||["d",sl,name]}}
  if(n)out.push([c,v.n,v.f,n,first])}
 return out.sort((a,b)=>b[3]-a[3]).slice(0,6)}

 const qw=q.split(" ");const hits=SIDX.map(it=>[it,sScore(it,q,qw)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||((a[0].k==="p"?inSeason(a[0].p):0)<(b[0].k==="p"?inSeason(b[0].p):0)?1:-1));
 const ps=hits.filter(h=>h[0].k==="p").slice(0,12).map(h=>h[0].p),rs=hits.filter(h=>h[0].k==="d").slice(0,12).map(h=>h[0]);
 const pRow=p=>`<button class="sr" data-open="${p.id}"><img src="${IP}${p.id}.webp" alt="" loading="lazy"><span><b>${esc(p.name)}</b><small>${esc(p.local||p.sci)}</small></span>${inSeason(p)&&inRegion(p)?`<em class="sr-tag">In season</em>`:inRegion(p)?"":`<em class="sr-tag off">Not in your area</em>`}</button>`;
 const dRow=x=>{const im=dishImg(x.r)||{src:""};return `<button class="sr" data-dish="${x.i}"><img src="${im.src}" alt="" loading="lazy"${im.fb?` data-fb="${im.fb}" onerror="this.onerror=null;this.src=this.dataset.fb"`:""}><span><b>${esc(x.r.n)}</b><small>${esc(COURSES.find(c=>c[0]===x.r.c)[1])}</small></span>${rUntil(x.r)===0?`<em class="sr-tag">In season</em>`:""}</button>`};
 box.innerHTML=(ps.length?`<h3 class="sres-h">Wild foods</h3>${ps.map(pRow).join("")}`:"")+(rs.length?`<h3 class="sres-h">Recipes</h3>${rs.map(dRow).join("")}`:"")+(ps.length||rs.length?"":`<p class="sres-hint">No matches in ${esc(C.the||C.name)}.</p>`)+`<div id="sres-other"></div>`;

  el.innerHTML=`<h3 class="sres-h">Found in other countries</h3>`+o.map(([c,n,f,k,fi])=>`<a class="sr" href="../${c}/#${fi[0]}/${encodeURIComponent(fi[1])}"><span class="flag notr sr-flag">${f}</span><span><b>${esc(n)}</b><small>${k} match${k>1?"es":""}, e.g. ${esc(fi[2])}</small></span></a>`).join("")})}
