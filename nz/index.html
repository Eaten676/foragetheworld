.cscroll::-webkit-scrollbar{display:none}

.sheet .hero{padding:0;max-width:none}
.vbox .vframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000;border-radius:10px}
.dimg.ing::after{display:none}
.btn.share svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;margin-right:6px;vertical-align:-3px}

.noimg{display:grid;place-items:center;width:100%;height:100%;font-family:var(--display);font-size:3rem;font-weight:700;color:var(--green);background:var(--green-soft)}
.favtag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.62);color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px}
.dcard b{display:block;font-family:var(--display);font-size:.98rem;line-height:1.2;margin-top:7px}
.dmeta{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}.dmeta.now{color:var(--green);font-weight:700}

@media (prefers-reduced-motion:no-preference){.card,.row,.chip{transition:border-color .15s,background .15s}}

ves so it regrows. Pick away from roads, sprayed verges and dog-walking paths.", "fruit": "Pick only fully ripe fruit that comes away easily, into a shallow container so it doesn't crush. Leave plenty on the plant for birds and wildlife.", "root": "Only dig roots where you have the landowner's permission, since uprooting wild plants is illegal in many places. Take a few from a large patch and backfill the hole.", "starch": "Tap or collect only from healthy, mature trees, and only in the short season the sap runs. Remove taps afterwards so the tree can heal.", "nut": "Gather nuts from the ground once they fall, discarding any with holes or mould. Leave plenty for wildlife, which depends on them for winter.", "flower": "Pick flowers on a dry, sunny morning once the dew has gone, when the scent is strongest. Take a few heads from each plant so it can still set fruit.", "grain": "Shake or strip ripe seed heads into a bag when they rattle and fall easily. Winnow out the chaff in a breeze.", "fungi": "Twist or cut mushrooms at the base, brush off soil in the woods and carry them in a basket, never a plastic bag. Only take ones you're 100% sure of, leave old and very young ones, and follow local limits.", "protein": "Check local rules, licences, size limits and water-quality warnings before taking any shellfish or fish."}, "HARVEST": {"nettle": "Wear gloves and snip the top four to six leaves of young plants before they flower. Cut back old patches in early summer for a second crop of tender tips.", "dandelion": "Pick young leaves from plants not yet in flower; flowers on a sunny morning when fully open; dig roots in autumn with permission.", "chickweed": "Snip the soft top few centimetres with scissors, leaving the roots so it regrows within weeks.", "watercress": "Cut stems above the water line with scissors, only from clean, flowing water away from livestock.", "blackberry": "Pick glossy, fully black berries that come away easily; wear long sleeves and avoid low berries by dog-walking paths.", "elderberry": "Cut whole drooping clusters when every berry is dark purple; strip off stalks with a fork before cooking.", "elderflower": "Cut fully open, creamy flower heads on a sunny morning; smell them and use the same day. Leave plenty for berries.", "rosehip": "Pick firm, bright red hips after a frost, from many bushes; leave plenty for birds.", "mussel": "Twist mussels off rocks at low tide, taking only large ones, and check local toxin warnings first.", "kawakawa": "Pick a few holey leaves from each shrub; the caterpillar holes mark the most flavoursome leaves.", "puha": "Pick young, tender leaves before flowering; older plants are bitter.", "pikopiko": "Pick a few unfurled fronds per plant, only of the right fern, as shown by someone experienced.", "horopito": "Pick a few leaves from each shrub and dry them.", "karengo": "Pluck sheets off rocks at low tide in winter and spring, taking a little from many rocks.", "sealettuce": "Pick fresh green sheets in rock pools, leaving the holdfast."}, "METHODS": [{"id": "dry", "name": "Dry herbs and greens", "keeps": "Keeps 6–12 months", "steps": ["Shake off insects and dirt; wash only if needed and dry well.", "Hang in small bunches or spread thinly on a screen in a warm, airy place out of direct sun.", "When leaves crumble, strip them from the stems.", "Store in airtight jars in the dark."]}, {"id": "freeze", "name": "Blanch and freeze", "keeps": "Keeps 8–12 months", "steps": ["Wash and trim.", "Plunge into boiling water for 1–2 minutes, then into ice water.", "Squeeze or drain dry and pack into portions.", "Freeze flat in bags so they thaw fast."]}, {"id": "jam", "name": "Jam, jelly and fruit cheese", "keeps": "Keeps a year unopened", "steps": ["Simmer fruit with a little water until soft; strain through a cloth for jelly.", "Add sugar (about equal weight for jam) and boil hard to setting point.", "Pour into hot sterilised jars and seal.", "Crab apples add pectin to low-pectin berries."]}, {    <a href="#menu" class="promise"><b>Cook</b><span>A Forage to Table menu, from drinks to desserts.</span></a>
  </section>
  ${dishes.length?`<section class="tonight"><div class="row-h"><h3>Tonight's forage to table</h3><a href="#menu">Full menu</a></div>
   <div class="cscroll">${dishes.map(r=>dishCard(r,COURSES.find(c=>c[0]===r.c)[1])).join("")}</div></section>`:""}
  <section class="install">
   <div><h3>Take it into the forest</h3><p>Add Forage ${esc(C.name)} to your home screen. It works offline, with no signal needed.</p></div>
   <div><button class="btn primary" id="installbtn" ${deferredInstall?"":"hidden"}>Add to home screen</button>
   <p class="hint">${ios?"On iPhone: tap Share, then <b>Add to Home Screen</b>.":"In your browser menu, tap <b>Add to Home screen</b> or <b>Install app</b>."}</p></div>
  </section>`;
  const ib=document.getElementById("installbtn");if(ib)ib.onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;ib.hidden=true};
}
function renderNear(){
  const L=local(), now=L.filter(p=>inSeason(p));
  const regs=regionsOf().map(r=>REGION_NAMES[r]).join(" & ");
  $("#v-near").innerHTML=`
  <div class="intro"><h2>Wild in ${esc(state.st)} this ${MONTHS[state.m-1]}</h2>
   <p class="stat"><b>${now.length}</b> in season now · ${L.length} in ${esc(regs)}</p></div>
  <div class="near-body">
  <div class="toolbar">
   <div class="searchrow"><input id="q" class="search" type="search" placeholder="Search plants or local names" value="${esc(state.q)}" aria-label="Search plants">
   <select id="sort" class="sortsel" aria-label="Sort">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}" ${state.sort===k?"selected":""}>${v}</option>`).join("")}</select></div>
   <div class="chiprow" role="toolbar" aria-label="Filters">
    <div class="seg" role="group" aria-label="Season"><button data-mode="now" aria-pressed="${state.mode==="now"}">Now</button><button data-mode="all" aria-pressed="${state.mode==="all"}">All year</button></div>
    <span class="vr" aria-hidden="true"></span>
    ${["all",...Object.keys(TYPES)].map(t=>`<button class="chip" data-type="${t}" aria-pressed="${state.type===t}">${t==="all"?"All":TYPES[t]}</button>`).join("")}
   </div>
   <div class="count" id="near-count"></div>
  </div>
  <div id="near-list"></div>
  </div>`;
  $("#sort").onchange=e=>{state.sort=e.target.value;renderNearList()};
  $("#q").addEventListener("input",e=>{state.q=e.target.value;renderNearList()});
  renderNearList();
}

function renderNutrition(){
  const n=NUTR[state.nutr], L=local().filter(p=>p.nutr.includes(state.nutr)).sort((a,b)=>(inSeason(b)-inSeason(a))||a.name.localeCompare(b.name));
  const nowCount=L.filter(p=>inSeason(p)).length;
  $("#v-nutrition").innerHTML=`
  <div class="intro"><div><h2>Find your nutrition in ${esc(state.st)}</h2>
  <p>Pick a nutrient to see which wild foods near you have it.</p></div></div>

  <div class="nutri-pick" role="group" aria-label="Nutrient">${Object.entries(NUTR).map(([k,v])=>`<button data-nutr="${k}" aria-pressed="${state.nutr===k}"><b>${v.name}</b><small>${v.blurb}</small></button>`).join("")}</div>
  <div class="panel"><h3>${n.name}</h3><p>${n.long}</p>
   <p><b>${nowCount}</b> of ${L.length} sources in your region are in season now.</p>
   <div class="list">${L.length?L.map(p=>`<button class="row" data-open="${p.id}"><span><b>${esc(p.name)}</b><br><span class="why">${esc(p.local.split(" · ")[0])} · ${p.months.length===12?"all year":p.months.map(m=>MONTHS[m-1]).join(", ")}</span></span><span class="pill ${inSeason(p)?"now":"later"}">${inSeason(p)?"In season":"Later"}</span></button>`).join(""):`<div class="empty">No strong wild source in your region. Buy this one.</div>`}</div>
  </div>`;
}

const COURSES=C.COURSES||[["drink","Drinks & juices"],["starter","Starters & snacks"],["side","Chutneys, pickles & raitas"],["main","Main course"],["bread","Breads & rice"],["dessert","Desserts"]];
const isHome=r=>r.h.some(x=>regionsOf().includes(x));
const homeScore=r=>{const rg=regionsOf();if(!r.h.length)return 0;const own=r.h[0]===rg[0]?3:r.h.includes(rg[0])?2:r.h.some(x=>rg.includes(x))?1:0;return own};
const rPlants=r=>r.u.map(id=>P.find(p=>p.id===id)).filter(Boolean);
const rUntil=r=>{const l=rPlants(r).filter(inRegion);return l.length?Math.min(...l.map(untilMonths)):99};
const ingImg=r=>{const pl=rPlants(r).find(p=>CREDITS[p.id]);return pl?`../img/${pl.id}.webp`:""};
const dishImg=r=>{const sl=dishSlug(r.n),fb=ingImg(r);if(DISHPICS[sl])return {src:`../img/dish_${sl}.webp`,dish:true};
  if(YTV[sl])return {src:`https://i.ytimg.com/vi/${YTV[sl].id}/mqdefault.jpg`,dish:true,yt:true,fb};return fb?{src:fb,dish:false}:null};
const imgFail=el=>{const f=el.dataset.fb;el.onerror=null;if(f){el.src=f;el.parentNode.classList.add("ing");el.parentNode.classList.remove("vid")}else el.remove()};
const seasonTxt=r=>{const u=rUntil(r);return u===0?"In season":u<99?"From "+MONTHS[mAt(u)-1]:"Other regions"};
function dishCard(r,label){const im=dishImg(r),u=rUntil(r),i=R.indexOf(r);
  return `<button class="dcard" data-dish="${i}"><span class="dimg${im&&!im.dish?" ing":""}${im&&im.yt?" vid":""}">${im?`<img src="${im.src}" alt="" loading="lazy"${im.yt?` data-fb="${im.fb}" onerror="imgFail(this)"`:""}>`:`<span class="noimg">${esc(r.n.charAt(0))}</span>`}</span>
  <b>${esc(r.n)}</b><span class="dmeta ${!label&&u===0?"now":""}">${label?esc(label):seasonTxt(r)}</span></button>`}
function openDish(i){const r=R[i];if(!r)return;const im=dishImg(r),sl=dishSlug(r.n),dp=DISHPICS[sl],yv=YTV[sl];
  $("#sheet-root").innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
   <header><div><span class="tag t-${r.c==="drink"?"fruit":"green"}">${COURSES.find(c=>c[0]===r.c)[1]}</span><h2 id="sh-t" style="margin-top:8px">${esc(r.n)}</h2>${isHome(r)?`<div class="fav" style="margin:4px 0 0">${esc(state.st)} favourite</div>`:""}</div><button class="close" id="sclose" aria-label="Close">✕</button></header>
   ${dp?`<figure class="hero"><img class="heroimg" src="${im.src}" alt="${esc(r.n)}"><figcaption>Photo: ${esc(dp.a)} · ${esc(dp.l)} · <a href="${esc(dp.s)}" target="_blank" rel="noopener">source</a></figcaption></figure>`:""}
   ${yv?`<figure class="hero vbox"><button class="vplay" id="vplay" aria-label="Play the ${esc(r.n)} recipe video"><img class="heroimg" src="https://i.ytimg.com/vi/${yv.id}/hqdefault.jpg" alt="" data-fb="${ingImg(r)}" onerror="imgFail(this)"><span class="pbadge" aria-hidden="true"></span></button>
     <figcaption>Video: <a href="https://www.youtube.com/watch?v=${yv.id}" target="_blank" rel="noopener">${esc(yv.ch)}</a> on YouTube</figcaption></figure>`
    :(!dp&&im?`<figure class="hero"><img class="heroimg" src="${im.src}" alt="${esc(r.n)}"><figcaption>Shown: the wild ingredient</figcaption></figure>`:"")}
   <div class="photo-links"><a class="btn primary" href="${yv?`https://www.youtube.com/watch?v=${yv.id}`:ytURL(r.yt)}" target="_blank" rel="noopener">▶ ${yv?"Watch on YouTube":"Find a recipe video"}</a>${waShare(r.n+": a wild food recipe from Forage "+C.name,`dishes/${sl}/`)}</div>
   <div class="facts">
    ${r.w?`<div class="callout"><b>Note.</b> ${esc(r.w)}</div>`:""}
    <div><h4>How to make it</h4><p>${esc(r.d)}</p></div>
    <div><h4>Season</h4><p>${seasonTxt(r)}</p></div>
    <div><h4>Wild ingredients</h4><div class="uses" style="display:flex;flex-wrap:wrap;gap:6px">${rPlants(r).map(p=>`<button class="chip" data-open="${p.id}">${esc(p.name)}</button>`).join("")}</div></div>
   </div></div></div>`;
  const close=()=>{$("#sheet-root").innerHTML="";document.removeEventListener("keydown",k);clearDeep()};const k=e=>{if(e.key==="Escape")close()};
  $("#sclose").onclick=close;$("#sbg").onclick=e=>{if(e.target.id==="sbg")close()};document.addEventListener("keydown",k);$("#sclose").focus();
  const vp=$("#vplay");if(vp)vp.onclick=()=>{const f=document.createElement("iframe");f.src=`https://www.youtube-nocookie.com/embed/${yv.id}?autoplay=1&rel=0`;f.title=r.n+" recipe video";f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";f.allowFullscreen=true;f.className="vframe";vp.replaceWith(f)};
}
function renderMenu(){
  const scope=state.menu||"now"; state.open=state.open||{};
  const pick=r=>scope==="all"?true:scope==="now"?rUntil(r)===0:rUntil(r)<99;
  const list=R.filter(pick);
  const nowN=R.filter(r=>rUntil(r)===0).length, locN=R.filter(r=>rUntil(r)<99).length;
  $("#v-menu").innerHTML=`
  <div class="menu-head2"><div><div class="eyebrow">Forage to Table</div><h2>The ${esc(state.st)} menu</h2>
   <p>${nowN} of ${locN} local dishes are in season in ${MONTHS[state.m-1]}.</p></div>
   <div class="seg" role="group" aria-label="Menu scope"><button data-menu="now" aria-pressed="${scope==="now"}">In season</button><button data-menu="local" aria-pressed="${scope==="local"}">My region</button><button data-menu="all" aria-pressed="${scope==="all"}">All ${esc(C.name)}</button></div></div>
  ${COURSES.map(([k,v])=>{const items=list.filter(r=>r.c===k).sort((a,b)=>(homeScore(b)-homeScore(a))||(rUntil(a)===0?0:1)-(rUntil(b)===0?0:1)||rUntil(a)-rUntil(b)||(!!DISHPICS[dishSlug(b.n)]-!!DISHPICS[dishSlug(a.n)])||a.n.localeCompare(b.n));
    if(!items.length)return "";
    const open=state.open[k];
    return `<section class="crow" id="course-${k}"><div class="crow-h"><h3>${v} <span>${items.length}</span></h3>${items.length>2?`<button class="seeall" data-more="${k}">${open?"Show less":"See all →"}</button>`:""}</div>
    <div class="${open?"cgrid":"cscroll"}">${items.map(dishCard).join("")}</div></section>`}).join("")||`<div class="empty">Nothing in season here this month. Try <b>My region</b>.</div>`}`;
}

function renderSafety(){
  $("#v-safety").innerHTML=`
  <div class="intro"><div><h2>Stay safe</h2><p>Most foraging accidents come from a confident wrong identification. These rules and plants apply anywhere in ${esc(C.the||C.name)}.</p></div></div>
  <div class="panel"><h3>Golden rules</h3><ol class="rules">
   ${C.rules.map(([b,t])=>`<li><span><b>${b}</b> ${t}</span></li>`).join("")}
  </ol></div>
  <h3 class="section-h">Never eat these</h3>
  <div class="danger-grid">${DANGER.map(([n,l,d])=>`<div class="panel danger"><h3>${n}</h3><div class="local" style="color:var(--muted);font-size:.85rem">${l}</div><p style="margin-top:6px">${d}</p></div>`).join("")}</div>
  <h3 class="section-h">Lookalikes to know</h3>
  <p style="color:var(--muted);margin:-4px 0 10px">The edible plant is on the left and its dangerous double on the right.</p>
  <div class="lk-grid">${LOOK.map(l=>{const p=P.find(x=>x.id===l.p[0]);return `<div class="panel">${lookBlock(p,l)}<div class="uses" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${l.p.map(id=>{const q=P.find(x=>x.id===id);return `<button class="chip" data-open="${id}">${esc(q.name)}</button>`}).join("")}</div></div>`}).join("")}</div>
  <h3 class="section-h">Plants that need preparing first</h3>
  <div class="list">${P.filter(p=>p.warn).map(p=>`<button class="row" data-open="${p.id}"><span><b>${esc(p.name)}</b><br><span class="why">${esc(p.warn)}</span></span></button>`).join("")}</div>`;
}

function openSheet(id){
  const p=P.find(x=>x.id===id);if(!p)return;
  const ms=p.methods.map(m=>METHODS.find(x=>x.id===m)?.name).filter(Boolean);
  $("#sheet-root").innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
   <header><div>${tag(p)}<h2 id="sh-t" style="margin-top:8px">${esc(p.name)}</h2><div class="sci">${esc(p.sci)}</div><div class="local" style="color:var(--muted)">${esc(p.local)}</div></div><button class="close" id="sclose" aria-label="Close">✕</button></header>
   ${galleryHTML(p)}
   <div class="photo-links">${CREDITS[p.id]?"":`<a class="btn ghost" href="${photoURL(p)}" target="_blank" rel="noopener">See photos</a>`}<a class="btn primary" href="${ytURL("how to harvest "+p.name+" "+p.local.split(" · ")[0])}" target="_blank" rel="noopener">Watch how to harvest</a><a class="btn primary" href="${ytURL(YT[p.id]||p.name+" recipe")}" target="_blank" rel="noopener">Watch how to prepare</a><a class="btn ghost" href="${wikiURL(p)}" target="_blank" rel="noopener">Read on Wikipedia</a>${waShare(p.name+": when it's in season, how to pick it and what to cook",`plants/${p.id}/`)}</div>
   <div class="facts">
    ${p.warn?`<div class="callout"><b>Caution.</b> ${esc(p.warn)}</div>`:""}
    ${lookFor(p).map(l=>lookBlock(p,l)).join("")}
    <div><h4>How to recognise it</h4><p>${esc(p.note)}</p></div>
    <div><h4>Season</h4>${strip(p)}</div>
    <div><h4>Where in ${esc(C.the||C.name)}</h4><p>${p.regions.map(r=>REGION_NAMES[r]).join(" · ")}${inRegion(p)?"":` <b>(not usually in ${esc(state.st)})</b>`}</p></div>
    ${p.nutr.length?`<div><h4>Good for</h4><p>${p.nutr.map(k=>NUTR[k].name).join(" · ")}</p></div>`:""}
    <div><h4>How to harvest</h4><p>${esc(harvestText(p))}</p></div>
    <div><h4>How to eat it</h4><p>${esc(p.eat)}</p></div>
    ${(()=>{const rs=R.filter(r=>r.u.includes(p.id));return rs.length?`<div><h4>On the menu</h4><p>${rs.map(r=>`<b>${esc(r.n)}</b> · <a href="${YTV[dishSlug(r.n)]?"https://www.youtube.com/watch?v="+YTV[dishSlug(r.n)].id:ytURL(r.yt)}" target="_blank" rel="noopener">video</a>`).join("<br>")}</p></div>`:""})()}
    <div><h4>How to store it</h4><p>${esc(p.store)}</p></div>
   </div></div></div>`;
  const close=()=>{$("#sheet-root").innerHTML="";document.removeEventListener("keydown",esc_);clearDeep()};
  const esc_=e=>{if(e.key==="Escape")close()};
  $("#sclose").onclick=close;$("#sbg").onclick=e=>{if(e.target.id==="sbg")close()};
  document.addEventListener("keydown",esc_);$("#sclose").focus();
}

const SITE=C.site;
const waShare=(title,path)=>`<a class="btn ghost share" href="https://wa.me/?text=${encodeURIComponent(title+"\n"+SITE+path)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 18.7z"/></svg>Share on WhatsApp</a>`;
const clearDeep=()=>{if(/^#[pd]\//.test(location.hash))history.replaceState(null,"",location.pathname+location.search)};
const VIEWS=["home","near","menu","nutrition","safety"];
function route(){
  const h=location.hash.slice(1),deep=/^[pd]\//.test(h)?h:"";
  const v=VIEWS.includes(h)?h:"home";
  $("#sheet-root").innerHTML="";
  const was=VIEWS.find(x=>!$("#v-"+x).hidden);
  VIEWS.forEach(x=>{$("#v-"+x).hidden=x!==v});
  if(was&&was!==v)window.scrollTo({top:0});
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+v?"page":"false"));
  if(deep){const id=decodeURIComponent(deep.slice(2));if(deep[0]==="p")openSheet(id);else{const i=R.findIndex(r=>dishSlug(r.n)===id);if(i>=0)openDish(i)}}
}
document.querySelector("a.brand").addEventListener("click",e=>{e.preventDefault();if(location.hash)history.pushState(null,"",location.pathname+location.search);route()});
addEventListener("popstate",route);
function renderTip(){$("#tip-root").innerHTML=TIP?fundHTML():""}
function renderFoot(){$("#foot").innerHTML=`Seasons and ranges are approximate and shift with weather and altitude. Identify every plant with an experienced local before eating it. Photos come from Wikimedia Commons under free licences, with credits under each one.<br><a href="${SITE}plants/">All wild plants</a> · <a href="${SITE}dishes/">All dishes</a> · <a href="${C.root}">Other countries</a>`}
document.title="Forage "+C.name;$("#cname").textContent=C.name;$("#brand").setAttribute("aria-label","Forage "+C.name+" home");
function renderAll(){renderFoot();renderTip();renderHome();renderNear();renderNutrition();renderMenu();renderSafety();route()}

const ss=$("#state");Object.keys(STATES).forEach(s=>ss.add(new Option(s,s,false,s===state.st)));
const ms=$("#month");MONTHS.forEach((m,i)=>ms.add(new Option(m,i+1,false,i+1===state.m)));
ss.onchange=e=>{state.st=e.target.value;store.set("fi-state-"+C.code,state.st);renderAll()};
ms.onchange=e=>{state.m=+e.target.value;renderAll()};
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-gsrc]");if(g){const h=document.getElementById("heroimg");if(h){h.src=g.dataset.gsrc;document.getElementById("herocap").innerHTML=g.dataset.gcap;document.querySelectorAll(".tb").forEach(t=>t.classList.toggle("on",t===g))}return}
  if(e.target.id==="copyupi"){const t=TIP.upiId;const done=()=>{e.target.textContent="Copied"};navigator.clipboard?.writeText(t).then(done,()=>{const r=document.createRange();r.selectNodeContents($("#upi"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r)});return}
  const o=e.target.closest("[data-open]");if(o){openSheet(o.dataset.open);return}
  const t=e.target.closest("[data-type]");if(t){state.type=t.dataset.type;renderNearList();return}
  const m=e.target.closest("[data-mode]");if(m){state.mode=m.dataset.mode;renderNearList();return}
  const dc=e.target.closest("[data-dish]");if(dc){openDish(+dc.dataset.dish);return}
  const mo=e.target.closest("[data-more]");if(mo){state.open=state.open||{};const k=mo.dataset.more;state.open[k]=!state.open[k];renderMenu();document.getElementById("course-"+k).scrollIntoView({block:"start"});return}
  const mm=e.target.closest("[data-menu]");if(mm){state.menu=mm.dataset.menu;renderMenu();return}
  const jp=e.target.closest("[data-jump]");if(jp){e.preventDefault();document.getElementById("course-"+jp.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start"});return}
  const n=e.target.closest("[data-nutr]");if(n){state.nutr=n.dataset.nutr;renderNutrition()}
});
addEventListener("hashchange",route);
renderAll();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}))}</script>
